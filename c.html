<div id="detail" class="detail"></div><div id="list" class="list"></div></main><script>
const DATA=[{"num": 1, "title": "Grammar and Fluency", "subtitle": "文法知識と流暢さ", "theme": "語学・教育", "level": "旧教材・特別教材", "body": "There are many people who think if they study grammar, they will automatically become good at a foreign language.\nHowever, if they are learning that language for the purpose of communication, they will find that they are mistaken.\nBecause of their knowledge of grammar, they are apt to be afraid of making mistakes and naturally they cannot speak freely.\nThe important thing for such people to develop is fluency, not an academic knowledge of the language.", "chunks": "読み上げるときは、/ のところで軽く区切ります。\n// では少し長めに間を取ります。\nThere are many people / who think / if they study grammar, / they will automatically become good / at a foreign language. //\nHowever, / if they are learning that language / for the purpose of communication, / they will find / that they are mistaken. //\nBecause of their knowledge of grammar, / they are apt to be afraid / of making mistakes / and naturally / they cannot speak freely. //\nThe important thing / for such people to develop / is fluency, / not an academic knowledge / of the language. //", "translation": "文法を勉強すれば、自動的に外国語が上手になると考えている人はたくさんいます。\nしかし、コミュニケーションを目的としてその言語を学んでいるのであれば、その考えが間違っていることに気づくでしょう。\n文法の知識があるために、そうした人たちは間違いを犯すことを恐れがちになり、その結果、自然と自由に話すことができなくなります。\nそのような人たちが身につけるべき大切なものは、言語についての学問的な知識ではなく、**流暢さ（fluency）**なのです。", "important": "automatically\n「自動的に」「自然に」\nbecome good at ～\n「～が上手になる」\nfor the purpose of ～\n「～を目的として」\nbe mistaken\n「間違っている」\nbecause of ～\n「～のために」「～が原因で」\nbe apt to do\n「～しがちである」「～する傾向がある」\nbe afraid of ～ing\n「～することを恐れる」\nmake mistakes\n「間違いをする」\nspeak freely\n「自由に話す」\nfluency\n「流暢さ」\nacademic knowledge\n「学問的な知識」", "extra": [{"title": "音読トレーニング", "text": "ROUND 1　意味確認\n日本語訳を確認しながら、ゆっくり2回読む。\nROUND 2　チャンク音読\n/ ごとに意味をイメージしながら3回読む。\nROUND 3　英語のまま理解\n日本語に訳さず、英文の語順のまま3回読む。\nROUND 4　スピード音読\n自然な会話速度を意識して2回読む。\nROUND 5　仕上げ\n本文を見ながら1回、できれば本文を見ずに内容を英語で説明する。\n合計：11回"}, {"title": "内容確認", "text": "Q1. What do many people think will make them good at a foreign language?\nQ2. Why may knowledge of grammar make some learners afraid to speak?\nQ3. According to the passage, what is more important for communication than academic knowledge?\n<details> <summary>答えを確認<\/summary>\nA1. They think studying grammar will automatically make them good at a foreign language.\nA2. Because they may become afraid of making mistakes.\nA3. Fluency.\n<\/details>"}, {"title": "今日の一文", "text": "The important thing to develop is fluency, not just academic knowledge.\n「身につけるべき大切なものは、単なる学問的知識ではなく、流暢さである。」\nこの一文を最後に5回音読する。"}], "special": true}, {"num": 2, "title": "Repetition and Learning", "subtitle": "反復と学習", "theme": "語学・教育", "level": "旧教材・特別教材", "body": "One of the conditions of learning is repetition.\nThis is true, not only of language learning, but of any skill, such as piano playing or bicycle riding.\nNo one has ever learned how to play the piano by playing the scale on its keyboard just once.\nEvery boy knows that in order to be able to ride a bicycle, he must try again and again, before he is able to balance himself and step on the pedals without falling over.\nThe need of repetition as a necessary step in the acquisition of a skill is obvious to everyone.\nBut it's also clear to all that there is nothing more boring than repetition.\nIf one fails to acquire a certain skill, it's not because the skill is difficult, but because the repetition that it requires is so unbearably boring.", "chunks": "/ で軽く区切り、// で一呼吸置きます。\nOne of the conditions of learning / is repetition. //\nThis is true, / not only of language learning, / but of any skill, / such as piano playing / or bicycle riding. //\nNo one has ever learned / how to play the piano / by playing the scale / on its keyboard / just once. //\nEvery boy knows / that in order to be able to ride a bicycle, / he must try again and again, / before he is able to balance himself / and step on the pedals / without falling over. //\nThe need of repetition / as a necessary step / in the acquisition of a skill / is obvious to everyone. //\nBut it's also clear to all / that there is nothing more boring / than repetition. //\nIf one fails to acquire a certain skill, / it's not because the skill is difficult, / but because the repetition / that it requires / is so unbearably boring. //", "translation": "学習の条件の一つは、反復することです。\nこれは語学学習だけでなく、ピアノを弾くことや自転車に乗ることなど、あらゆる技能について当てはまります。\nピアノの鍵盤で音階をたった一度弾いただけで、ピアノの弾き方を身につけた人などいません。\n自転車に乗れるようになるためには、バランスを取って転ばずにペダルを踏めるようになるまで、何度も何度も挑戦しなければならないことは誰でも知っています。\n技能を習得するうえで、反復が必要な段階であることは誰の目にも明らかです。\nしかし同時に、反復ほど退屈なものはないということも明らかです。\nある技能を身につけられないとすれば、それはその技能が難しいからではなく、その技能が要求する反復練習が耐えがたいほど退屈だからなのです。", "important": "condition\n「条件」\nrepetition\n「反復・繰り返し」\nnot only A but (also) B\n「AだけでなくBも」\nsuch as ～\n「～のような」\nby ～ing\n「～することによって」\nin order to do\n「～するために」\nagain and again\n「何度も何度も」\nbalance oneself\n「バランスを取る」\nfall over\n「転倒する・倒れる」\nacquisition\n「習得・獲得」\nacquisition of a skill\n「技能の習得」\nobvious\n「明らかな」\nacquire a skill\n「技能を習得する」\nnot because A, but because B\n「Aだからではなく、Bだから」\nrequire\n「必要とする・要求する」\nunbearably\n「耐えられないほど」", "extra": [{"title": "文型で覚える", "text": "not only A but B\nnot only of language learning, but of any skill\n「語学学習だけでなく、あらゆる技能について」\n英作文でも非常に使いやすい構文です。\nTechnology affects not only our work but our daily lives.\n技術は仕事だけでなく、私たちの日常生活にも影響を与える。\nin order to do\nin order to be able to ride a bicycle\n「自転車に乗れるようになるために」\n目的を明確に示す表現です。\nIn order to solve environmental problems, international cooperation is essential.\n環境問題を解決するためには、国際協力が不可欠である。\nnot because A, but because B\nIt's not because the skill is difficult, but because ...\n「その技能が難しいからではなく、……だからである」\n英検の英作文や面接でも、理由を対比させるときに使えます。\nPeople oppose the policy not because change is unnecessary, but because its cost is too high.\n人々がその政策に反対するのは、変化が不要だからではなく、その費用が高すぎるからである。"}, {"title": "実践ドリル", "text": "Q1\nOne of the conditions of learning is (　　　).\n<details> <summary>答えを見る<\/summary>\nrepetition\n学習の条件の一つは「反復」である。\n<\/details>\nQ2\nThis is true not only of language learning, (　　　) of any skill.\n<details> <summary>答えを見る<\/summary>\nbut\nnot only A but B\nAだけでなくBも。\n<\/details>\nQ3\nIn (　　　) to be able to ride a bicycle, he must try again and again.\n<details> <summary>答えを見る<\/summary>\norder\nin order to do\n～するために。\n<\/details>\nQ4\nThe acquisition (　　　) a skill requires repetition.\n<details> <summary>答えを見る<\/summary>\nof\nthe acquisition of a skill\n技能の習得。\n<\/details>\nQ5\nIt's not because the skill is difficult, (　　　) because the repetition is boring.\n<details> <summary>答えを見る<\/summary>\nbut\nnot because A, but because B\nAだからではなくBだから。\n<\/details>"}, {"title": "内容確認", "text": "Q1. What is one of the conditions of learning?\nQ2. What two examples of skills are given in the passage?\nQ3. Why must a person try again and again when learning to ride a bicycle?\nQ4. Why do people sometimes fail to acquire a skill?\n<details> <summary>解答を確認<\/summary>\nA1. Repetition.\nA2. Piano playing and bicycle riding.\nA3. Because they need to learn how to balance themselves and use the pedals without falling over.\nA4. Because the repetition required to acquire the skill can be unbearably boring.\n<\/details>"}, {"title": "音読トレーニング", "text": "ROUND 1｜内容確認 × 2回\n日本語訳を確認して、意味を理解する。\nROUND 2｜チャンク音読 × 3回\n/ ごとの意味を頭に浮かべながら読む。\nROUND 3｜英語の語順で理解 × 3回\n日本語に訳さず、英語を前から理解する。\nROUND 4｜スピード音読 × 3回\n文章全体を自然な速度で読む。\nROUND 5｜仕上げ × 1回\n本文を見ないで、内容を自分の英語で説明する。\n合計：12回"}, {"title": "今日の一文", "text": "One of the conditions of learning is repetition.\n「学習の条件の一つは反復である。」\nそしてもう一文。\nIt's not because the skill is difficult, but because the repetition that it requires is so unbearably boring.\n「技能が難しいからではなく、それに必要な反復が耐えがたいほど退屈だからである。」\n最後にそれぞれ 5回音読する。"}], "special": true}, {"num": 3, "title": "Learning from Mistakes", "subtitle": "", "theme": "語学・教育", "level": "英検2級", "body": "Many students are afraid of making mistakes when they learn a foreign language. They may know the correct grammar and understand many words, but they hesitate to speak because they want every sentence to be perfect.\nHowever, mistakes are a natural part of learning. When students try to express their ideas and discover that something is wrong, they have an opportunity to learn.\nFor this reason, learners should not wait until their English is perfect. Using the language regularly is one of the best ways to improve it.\n重要表現\nbe afraid of ～ing / hesitate to do / express one's ideas / have an opportunity to do / one of the best ways to do\n音読POINT\nlearners should not wait / until their English is perfect", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 4, "title": "Reading Every Day", "subtitle": "", "theme": "語学・教育", "level": "英検2級", "body": "Many people believe that they need a long period of free time to improve their English. As a result, they often put off studying until they have enough time.\nIn fact, reading English for only ten or fifteen minutes every day can be effective. Regular contact with the language helps learners become familiar with common words and sentence patterns.\nThe important point is not how much we study on a particular day, but how regularly we continue. A small amount of daily practice can eventually produce a significant result.\n重要表現\nput off / in fact / become familiar with / a small amount of / eventually\n音読POINT\nThe important point is not how much we study / but how regularly we continue.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 5, "title": "The Importance of Asking Questions", "subtitle": "", "theme": "語学・教育", "level": "英検2級", "body": "Some students remain silent when they do not understand something. They may be embarrassed to ask a question because they think other students already know the answer.\nHowever, asking questions is an important part of learning. A good question can help not only the person who asks it but also other people in the classroom.\nStudents should remember that not understanding something is not a failure. Recognizing what they do not know is often the first step toward deeper understanding.\n重要表現\nremain silent / be embarrassed to do / not only A but also B / the first step toward", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 6, "title": "Learning with a Dictionary", "subtitle": "", "theme": "語学・教育", "level": "英検2級", "body": "A dictionary can provide much more information than the meaning of a word. It can show pronunciation, grammatical patterns, common expressions, and examples of how a word is actually used.\nNevertheless, learners sometimes look at only the Japanese translation and immediately close the dictionary. By doing so, they may miss useful information.\nWhen looking up an unfamiliar word, learners should spend a little time examining its examples. This habit can gradually help them understand how words work together in real English.\n重要表現\nprovide / nevertheless / by doing so / look up / unfamiliar / gradually", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 7, "title": "Studying in Short Sessions", "subtitle": "", "theme": "語学・教育", "level": "英検2級", "body": "Studying for several hours at once is not always the most effective way to learn. After concentrating for a long time, people often become tired and find it difficult to remember new information.\nShorter study sessions can sometimes be more useful. For example, a learner might study vocabulary for twenty minutes in the morning and review it again in the evening.\nBy returning to the same material several times, learners give themselves repeated opportunities to remember it. Regular review is often more valuable than one long period of study.\n重要表現\nat once / concentrate / study session / return to / repeated opportunities", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 8, "title": "Why We Forget", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Forgetting is often regarded as a sign of unsuccessful learning, but it is actually a normal function of the human brain. We receive enormous amounts of information every day, and it would be impossible to remember all of it.\nInformation that is rarely used tends to become difficult to recall. On the other hand, information that is repeatedly retrieved becomes easier to remember.\nThis is why reviewing material at appropriate intervals is effective. Instead of becoming disappointed when we forget something, we can regard forgetting as a signal that another review is necessary.\n重要表現\nbe regarded as / enormous amounts of / tend to / recall / retrieve / at appropriate intervals", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 9, "title": "Learning through Context", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Learning individual words from a list can be useful, but words are easier to understand when they appear in context. A word may have several meanings, and its exact meaning often depends on the words around it.\nFor example, learners who encounter a new expression in a story can observe who uses it, what situation it describes, and what words commonly appear with it.\nContext therefore provides information that a simple translation cannot always give. Reading widely helps learners develop a more flexible understanding of vocabulary.\n重要表現\nindividual / in context / depend on / encounter / therefore / flexible", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 10, "title": "The Value of Writing by Hand", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Digital devices have made it easy to record large amounts of information quickly. Nevertheless, writing notes by hand may still have advantages for learners.\nBecause handwriting is slower than typing, students must often decide which information is important instead of copying every sentence. This process requires them to think about the meaning of what they hear.\nFor this reason, handwritten notes can sometimes help students remember and organize information more effectively. The best method, however, may depend on the learner and the purpose of the task.\n重要表現\nby hand / advantage / instead of / require / organize / depend on", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 11, "title": "Listening before Speaking", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Young children usually listen to their native language for a long time before they begin to speak it well. During this period, they become familiar with its sounds, rhythm, and common patterns.\nAdult language learners can also benefit from listening to large amounts of understandable English. Regular listening provides examples of pronunciation and natural expressions that textbooks alone cannot fully teach.\nSpeaking practice is certainly necessary, but careful listening gives learners a model to imitate. In this sense, listening and speaking should support each other.\n重要表現\nnative language / become familiar with / benefit from / imitate / in this sense / support each other", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 12, "title": "The Role of Motivation", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Two students may use the same textbook and attend the same class but achieve very different results. One reason for this difference is motivation.\nLearners who have a clear reason for studying are more likely to continue when learning becomes difficult. Their goal may be passing an examination, communicating with people overseas, or simply enjoying books and films in another language.\nMotivation alone cannot guarantee success, but it can provide the energy needed for long-term practice. A meaningful goal often makes repeated effort easier to maintain.\n重要表現\nachieve / motivation / be likely to / guarantee / long-term / maintain", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 13, "title": "Learning with Other People", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Learning is often considered an individual activity, but interaction with other people can greatly improve the process. When learners explain an idea to someone else, they must organize their own thoughts clearly.\nDiscussion also exposes people to opinions and approaches that they may not have considered before. Even disagreement can be valuable if participants listen carefully and explain their reasons.\nStudying with others does not mean that independent study is unnecessary. Rather, individual thinking and communication can complement each other.\n重要表現\ninteraction / organize one's thoughts / expose A to B / disagreement / rather / complement", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 14, "title": "Extensive Reading", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Language students often spend a great deal of time carefully analyzing short passages. Such study is useful, but another approach is to read large amounts of relatively easy material.\nThis method is known as extensive reading. Because readers do not need to stop at every unfamiliar word, they can concentrate on the overall meaning and enjoy the content.\nOver time, repeated exposure to words and grammatical patterns can increase reading speed and strengthen vocabulary. The key is to choose material that is interesting and not excessively difficult.\n重要表現\na great deal of / approach / extensive reading / overall / exposure / excessively", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 15, "title": "Using Technology for Learning", "subtitle": "", "theme": "語学・教育", "level": "英検2級→準1級", "body": "Technology has greatly expanded the resources available to language learners. People can now listen to foreign radio, watch educational videos, use electronic dictionaries, and communicate with speakers around the world.\nHowever, access to information does not automatically result in learning. A person can spend hours moving from one website to another without concentrating deeply on anything.\nTechnology is most useful when it supports a clear learning purpose. Learners should therefore decide what they want to achieve before choosing which tools to use.\n重要表現\nexpand / available to / access to / result in / concentrate on / achieve", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 16, "title": "Knowledge and Understanding", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Memorizing information and understanding it are not necessarily the same thing. A student may be able to repeat a definition accurately without being able to explain why it matters or how it can be applied.\nUnderstanding becomes deeper when learners connect new information with knowledge they already possess. They may compare ideas, identify differences, or use a concept to solve a new problem.\nFor this reason, effective education should not focus exclusively on remembering facts. Students also need opportunities to examine relationships among ideas and use knowledge in unfamiliar situations.\n重要表現\nnot necessarily / accurately / apply / possess / identify / exclusively / unfamiliar", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 17, "title": "The Testing Effect", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Students commonly use rereading as a method of review. Although rereading can make material feel familiar, research on learning suggests that trying to recall information may be more effective.\nWhen learners test themselves, they must retrieve information from memory rather than simply recognize it on a page. This effort strengthens their ability to remember the information later.\nTests therefore do not have to be used only for evaluation. Short quizzes, flash cards, and self-questioning can also serve as powerful learning tools.\n重要表現\nrereading / recall / retrieve / rather than / strengthen / evaluation / serve as", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 18, "title": "Learning from Different Sources", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Relying on a single source can make learning simple, but it may also limit our understanding. Different books, teachers, and media often explain the same subject from different perspectives.\nComparing several sources allows learners to notice disagreements and examine the evidence supporting each claim. This is especially important when dealing with complex subjects for which there may be no single correct interpretation.\nUsing multiple sources requires additional effort, but it encourages learners to evaluate information rather than accept it passively.\n重要表現\nrely on / limit / perspective / evidence / claim / interpretation / passively", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 19, "title": "Critical Thinking", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "The enormous amount of information available online has made critical thinking increasingly important. Information can spread rapidly even when it is inaccurate or misleading.\nCritical thinkers do not reject information simply because they disagree with it. Instead, they ask where it came from, what evidence supports it, and whether alternative explanations exist.\nSuch habits require time and effort, but they help people make more reasonable judgments. Education therefore has an important role in teaching students not merely what to think, but how to examine information.\n重要表現\ncritical thinking / increasingly / misleading / alternative / reasonable judgment / merely", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 20, "title": "The Importance of Background Knowledge", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Reading ability depends on more than vocabulary and grammar. Readers also use their existing knowledge to interpret what a text means.\nA person who knows a great deal about astronomy, for example, may understand an article about space even if it contains several unfamiliar words. Background knowledge allows the reader to make reasonable guesses and connect new information with familiar concepts.\nThis suggests that improving reading ability involves more than studying language itself. Learning about history, science, society, and culture can indirectly make someone a stronger reader.\n重要表現\ndepend on / existing knowledge / interpret / background knowledge / reasonable guess / indirectly", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 21, "title": "Learning throughout Life", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Education was once widely associated with childhood and early adulthood. Today, however, rapid technological and social change means that people may need to acquire new knowledge throughout their lives.\nWorkers sometimes have to learn new systems when their industries change. Retired people may study languages, history, music, or technology for intellectual enjoyment and social interaction.\nLifelong learning is therefore not limited to professional training. It can help individuals adapt to change, remain intellectually active, and discover interests that were unavailable to them earlier in life.\n重要表現\nbe associated with / acquire / throughout / intellectual / lifelong learning / adapt to", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 22, "title": "Information Is Not Knowledge", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Modern technology gives people almost immediate access to an extraordinary amount of information. As a result, finding facts has become much easier than it was in the past.\nYet having access to information is not the same as possessing knowledge. Knowledge requires people to select relevant information, understand relationships, evaluate reliability, and connect new facts with what they already know.\nThe ability to search efficiently is certainly useful, but it cannot completely replace learning. Information becomes meaningful knowledge only when people actively process and understand it.\n重要表現\nimmediate access / extraordinary / relevant / reliability / efficiently / process", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 23, "title": "The Limits of Translation", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Translation is an extremely useful tool for language learners, but exact equivalents do not always exist between languages. A word may carry cultural associations or emotional meanings that are difficult to reproduce.\nFor this reason, learners who depend entirely on translation may sometimes misunderstand how a word is actually used. Examining several examples can reveal differences that a short dictionary definition cannot show.\nAs proficiency develops, learners gradually become able to connect foreign words directly with ideas rather than constantly passing through their native language.\n重要表現\nequivalent / cultural association / reproduce / depend entirely on / reveal / proficiency / rather than", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 24, "title": "What Does It Mean to Understand?", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "People often say that they understand something when they recognize an explanation they have seen before. Recognition, however, may create an illusion of understanding.\nA stronger test is whether a person can explain the idea in different words, give an example, apply it to a new situation, or answer an unexpected question about it.\nThis distinction is particularly important in examination preparation. Repeatedly reading an answer may produce confidence, but attempting to reconstruct the answer from memory reveals more accurately what has actually been learned.\n重要表現\nrecognition / illusion / distinction / particularly / reconstruct / reveal / accurately", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 25, "title": "From Knowledge to Fluency", "subtitle": "", "theme": "語学・教育", "level": "英検準1級", "body": "Language learners need vocabulary and grammar, but knowledge alone does not guarantee fluent communication. During a real conversation, there is rarely enough time to consciously search through grammatical rules before producing every sentence.\nFrequent exposure and repeated use gradually make common patterns easier to process. Expressions that once required careful thought can eventually be understood and produced almost automatically.\nFluency therefore does not mean speaking without knowledge. Rather, it develops when knowledge has been practiced so thoroughly that much of it can be used without deliberate effort.\nThis is why reading aloud, listening, speaking, and repeated practice can play an important role in advanced language learning.\n重要表現\nguarantee / consciously / exposure / process / automatically / thoroughly / deliberate effort\n音読POINT\nFluency develops / when knowledge has been practiced so thoroughly / that much of it can be used / without deliberate effort.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 26, "title": "The Value of a Morning Routine", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "How people begin their morning can affect the rest of their day. Some people immediately check messages or social media after waking up, while others prefer to eat breakfast, exercise, or read quietly.\nA simple morning routine can help people prepare both physically and mentally for the day ahead. It does not need to be complicated. Even ten minutes of planning can make it easier to decide what should be done first.\nThe most useful routine is one that fits a person's lifestyle and can be continued without unnecessary stress.\n重要表現\naffect / immediately / prefer to do / prepare for / the day ahead / fit one's lifestyle\n音読POINT\nThe most useful routine is one / that fits a person's lifestyle / and can be continued / without unnecessary stress.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 27, "title": "Cooking at Home", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "Convenience stores, restaurants, and food delivery services have made it easy to obtain prepared meals. Nevertheless, cooking at home still offers several advantages.\nPeople who prepare their own meals can choose the ingredients and control how much salt, sugar, or oil they use. Cooking can also be less expensive than regularly eating at restaurants.\nIn addition, preparing food can become an enjoyable activity rather than simply a daily duty. Families and friends can cook together and share both the work and the experience.\n重要表現\nprepared meals / offer an advantage / ingredient / less expensive than / in addition / rather than", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 28, "title": "Walking in the Neighborhood", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "People sometimes believe that exercise requires special equipment or a gym membership. In fact, one of the simplest forms of exercise is walking.\nWalking around one's neighborhood provides an opportunity to notice things that are easily missed when traveling by car. People may discover a small shop, observe seasonal changes, or meet neighbors they rarely see.\nRegular walking can therefore benefit both physical health and people's connection with their local community. A familiar neighborhood may even appear different when explored on foot.\n重要表現\nrequire / in fact / provide an opportunity / seasonal changes / benefit / on foot", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 29, "title": "Keeping a Diary", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "A diary is often thought of as a record of important events, but it can also be a useful tool for organizing everyday thoughts.\nWriting about an experience requires people to choose words and decide which details are important. In this process, feelings or problems that seemed unclear may become easier to understand.\nA diary does not have to contain long entries. Even a few sentences written regularly can create a valuable record of how a person's ideas and interests change over time.\n重要表現\nbe thought of as / organize / experience / in this process / entry / over time", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 30, "title": "Why Hobbies Matter", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "Adults often become so busy with work and family responsibilities that they have little time for hobbies. However, activities done simply for enjoyment can play an important role in daily life.\nA hobby gives people a chance to concentrate on something different from their usual responsibilities. Music, gardening, sports, photography, or crafts may provide both relaxation and a sense of achievement.\nHobbies can also introduce people to others who share similar interests. What begins as a private activity can sometimes develop into a new community.\n重要表現\nresponsibility / simply for enjoyment / concentrate on / a sense of achievement / have similar interests", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 31, "title": "Learning to Repair Things", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "When a household item stops working, replacing it may seem easier than repairing it. Modern products are often inexpensive, and professional repairs can sometimes cost almost as much as a new product.\nHowever, learning simple repair skills has several benefits. Repairing an item can save money, reduce waste, and help people understand how everyday objects work.\nNot everything should be repaired by an inexperienced person, especially electrical equipment that may be dangerous. Still, basic knowledge can help people decide whether something truly needs to be thrown away.\n重要表現\nhousehold item / replace / repair / reduce waste / inexperienced / throw away", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 32, "title": "The Importance of Sleep", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "People sometimes reduce their sleeping time when they become busy. They may believe that staying awake for several more hours will allow them to finish more work.\nHowever, lack of sleep can reduce concentration and make it harder to remember information. A tired person may spend longer completing a task and make mistakes that would normally be avoided.\nFor this reason, sleep should not simply be regarded as time when nothing is accomplished. Adequate rest is an important part of maintaining both physical and mental performance.\n重要表現\nstay awake / lack of sleep / concentration / complete a task / adequate / maintain", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 33, "title": "Public Libraries in the Digital Age", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "The internet has changed the way people obtain information, leading some to wonder whether public libraries are still necessary.\nLibraries, however, provide more than printed books. Many offer digital materials, study spaces, children's programs, local information, and assistance from trained staff.\nThey also provide access to resources for people who may not have suitable technology or a quiet place to study at home. Rather than disappearing, libraries can change their services to meet new needs.\n重要表現\nobtain / lead A to do / provide more than / assistance / access to / rather than", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 34, "title": "Eating Together", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "In busy households, family members may follow different schedules and eat their meals separately. Although this may be convenient, eating together can provide an important opportunity for communication.\nDuring a meal, people can talk about what happened during the day, discuss plans, and share concerns. Such conversations may be especially valuable when family members otherwise have little time together.\nOf course, every family has different circumstances. The important point is not that every meal must be shared, but that people create regular opportunities to communicate.\n重要表現\nseparately / provide an opportunity / concern / especially / circumstance / create opportunities", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 35, "title": "Using Time Wisely", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級", "body": "People often say that they do not have enough time, yet everyone receives the same twenty-four hours each day. The real problem is often how that time is used.\nSmall amounts of time are easily lost while checking messages, waiting for transportation, or moving between activities. Some of these periods can be used for reading, reviewing vocabulary, or planning.\nThis does not mean that every minute must be productive. Rest is also necessary. Managing time wisely means deciding consciously what deserves our attention.\n重要表現\nyet / transportation / productive / manage / consciously / deserve one's attention", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 36, "title": "Local Festivals", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Local festivals may appear to be simply entertainment, but many have a much deeper cultural significance. Some originated in religious ceremonies, seasonal celebrations, or events connected with agriculture and fishing.\nPreparing for a festival often requires cooperation among local residents. Older participants may teach traditional songs, dances, or techniques to younger generations.\nIn this way, festivals can strengthen relationships within a community while passing cultural knowledge from one generation to the next. Their value therefore extends beyond the event itself.\n重要表現\ncultural significance / originate in / be connected with / cooperation / generation / extend beyond", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 37, "title": "Traditional Crafts", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Traditional crafts often require skills that have been developed and refined over many generations. A skilled craftsperson may spend years learning how to handle particular materials and tools.\nHowever, many traditional industries face difficulties because demand has declined and fewer young people are willing to enter the profession.\nSimply preserving old techniques in museums may not be enough. Some craftspeople are creating modern products while continuing to use traditional methods. By adapting to changing lifestyles, old skills may find new purposes.\n重要表現\nrefine / craftsperson / demand / decline / preserve / adapt to / purpose", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 38, "title": "Why People Collect Things", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "People collect an extraordinary variety of objects, from stamps and coins to books, photographs, and old machines. The financial value of these objects is not always the main reason for collecting them.\nA collection may preserve memories, represent a person's interests, or provide a way to study a particular subject in depth. Searching for a missing item can itself become part of the enjoyment.\nCollections can also tell stories about the past. Ordinary objects sometimes reveal details of daily life that formal historical records do not contain.\n重要表現\na variety of / financial value / preserve / represent / in depth / reveal / historical record", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 39, "title": "Music and Memory", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "A familiar piece of music can sometimes bring back memories with surprising strength. A song heard many years ago may remind someone of a particular place, person, or period of life.\nOne reason may be that music is often experienced together with emotional events. As a result, the sound and the memory become closely connected.\nThis relationship is one reason music can be meaningful throughout a person's life. Musical taste may change, but certain songs can continue to serve as links to earlier experiences.\n重要表現\nbring back memories / remind A of B / emotional / as a result / closely connected / serve as", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 40, "title": "The Meaning of Handwritten Letters", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Electronic communication allows messages to be exchanged almost instantly. Because of this convenience, handwritten letters have become much less common.\nYet a handwritten letter can have a different emotional value. Writing one requires time, and the writer's handwriting makes each message physically unique.\nThis does not mean that letters are superior to digital communication. Each serves a different purpose. A short message may be ideal for exchanging information quickly, while a letter can sometimes express care precisely because it requires additional effort.\n重要表現\ninstantly / convenience / emotional value / unique / superior to / precisely because", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 41, "title": "Changes in Shopping Habits", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Online shopping has transformed consumer behavior. People can compare prices, read reviews, and order products without leaving home.\nThis convenience has clear advantages, especially for people who live far from large stores. At the same time, online purchasing can make it easier to buy things impulsively because payment requires only a few clicks.\nConsumers therefore need to distinguish between convenience and necessity. Technology can make purchasing easier, but it cannot decide whether a product is truly needed.\n重要表現\ntransform / consumer behavior / especially / at the same time / impulsively / distinguish between A and B", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 42, "title": "Secondhand Goods", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Buying used goods was once associated mainly with saving money, but attitudes toward secondhand products have changed. Clothing, furniture, books, and electronic equipment are now widely bought and sold through online services.\nReusing products can extend their useful life and reduce the amount of waste sent for disposal. It can also allow consumers to obtain higher-quality items at lower prices.\nHowever, buyers need to check the condition of products carefully. In the case of electrical equipment, safety and reliability may be more important than price alone.\n重要表現\nsecondhand / be associated with / extend / disposal / obtain / reliability", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 43, "title": "Tourism and Local Culture", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Tourism can bring economic benefits to a community by supporting hotels, restaurants, transportation services, and local shops. It can also encourage interest in regional history and culture.\nHowever, excessive tourism may create problems. Popular areas can become crowded, local residents may face rising costs, and cultural traditions may be changed mainly to satisfy visitors.\nThe challenge is to develop tourism without damaging the qualities that attract people in the first place. Successful tourism therefore requires cooperation between visitors, businesses, residents, and local governments.\n重要表現\neconomic benefit / encourage / excessive / satisfy / in the first place / cooperation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 44, "title": "Learning about Other Cultures", "subtitle": "", "theme": "日常生活・文化", "level": "英検2級→準1級", "body": "Learning about another culture involves more than memorizing facts about food, clothing, or festivals. To understand people's behavior, it is also necessary to consider history, social values, and everyday customs.\nProblems can occur when people judge another culture entirely according to the standards of their own society. A behavior that seems unusual may have a reasonable explanation within a different cultural context.\nUnderstanding does not require agreement with every practice. It requires a willingness to examine why different societies have developed different ways of living.\n重要表現\ninvolve / social values / entirely / according to / cultural context / willingness", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 45, "title": "Language and Culture", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "Languages do more than transmit information. They also reflect the history, customs, and values of the communities in which they developed.\nCertain expressions may be difficult to translate because they refer to experiences or social relationships that are particularly important in one culture. Even when a direct translation exists, the emotional effect may differ.\nFor language learners, this means that vocabulary cannot always be separated from cultural knowledge. Learning how and when an expression is used can be as important as knowing its dictionary meaning.\n重要表現\ntransmit / reflect / refer to / particularly / direct translation / be separated from", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 46, "title": "Preserving Historic Buildings", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "Old buildings can create difficult choices for growing cities. Maintaining them may be expensive, while replacing them can provide space for modern facilities and new development.\nNevertheless, historic buildings often contribute to a city's identity. They provide visible connections with earlier generations and can help residents understand how their community has changed.\nPreservation does not necessarily mean preventing all change. In some cases, old structures can be adapted for new purposes while important architectural features are retained. Such approaches allow cities to develop without completely erasing their physical history.\n重要表現\nmaintain / replace / contribute to / identity / preservation / retain / erase", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 47, "title": "Changing Ideas of Privacy", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "Ideas about privacy have changed as communication technology has developed. People now routinely share photographs, locations, opinions, and personal experiences with large numbers of others online.\nInformation shared for one purpose, however, may later be copied or used in an unexpected context. Once information has spread widely, removing it can be extremely difficult.\nFor this reason, digital privacy depends partly on decisions made before information is published. People need to consider not only who can see something today, but also how it might be used in the future.\n重要表現\nprivacy / routinely / personal / context / spread widely / depend partly on", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 48, "title": "Convenience and Patience", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "Modern services are designed to reduce waiting. Messages arrive instantly, entertainment is available on demand, and many products can be delivered within a short period.\nThese developments save time, but they may also influence people's expectations. When immediate results become normal, even a small delay can feel unusually frustrating.\nSome valuable activities, however, cannot be accelerated easily. Learning a language, mastering an instrument, developing professional skill, and building trust all require time. A society that values convenience may therefore need to remember the value of patience as well.\n重要表現\non demand / expectation / immediate / frustrating / accelerate / master / patience", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 49, "title": "Why Old Objects Matter", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "An old object may have little financial value yet still be extremely important to its owner. A worn book, a tool, a photograph, or a piece of furniture may be connected with a person or experience that can no longer be recovered.\nSuch objects function as physical links between memory and the present. Their scratches and signs of use may even increase their emotional significance rather than reduce it.\nThis helps explain why people sometimes preserve objects that appear useless to others. Value is not always determined by price or practical function; it can also arise from memory and personal history.\n重要表現\nfinancial value / be connected with / recover / function as / significance / arise from", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 50, "title": "Tradition and Change", "subtitle": "", "theme": "日常生活・文化", "level": "英検準1級", "body": "Traditions are often described as practices that have remained unchanged for generations. In reality, many traditions have continuously adapted to new social and economic conditions.\nA festival may adopt new technology, a traditional craft may use modern designs, and an old custom may acquire a different meaning for younger generations. Such changes do not necessarily destroy tradition.\nThe more important question is which elements people consider essential and wish to pass on. Tradition survives not simply by resisting change, but by maintaining a connection with the past while remaining meaningful in the present.\n重要表現\nremain unchanged / adapt to / acquire / necessarily / essential / pass on / resist\n音読POINT\nTradition survives / not simply by resisting change, / but by maintaining a connection with the past / while remaining meaningful in the present.\n第3分野｜社会・交通", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 51, "title": "Preventing Traffic Accidents", "subtitle": "交通事故を防ぐために", "theme": "社会・交通", "level": "旧教材・特別教材", "body": "Traffic accidents take a great many lives every year.\nWhen an accident occurs, it is the fault of the drivers rather than the pedestrians'.\nHow can these accidents be prevented?\nFirst of all, drivers and pedestrians should realize that it is their duty to observe the safety rules.\nSecond, traffic laws must be strictly enforced. Reckless and drunken drivers should be punished severely.\nThird, communities should do their share in preventing accidents.\nFor instance, driving at night in cities should be made safer by well-lighted streets.", "chunks": "/ で軽く区切り、// で一呼吸します。\nTraffic accidents / take a great many lives / every year. //\nWhen an accident occurs, / it is the fault of the drivers / rather than the pedestrians'. //\nHow can these accidents / be prevented? //\nFirst of all, / drivers and pedestrians should realize / that it is their duty / to observe the safety rules. //\nSecond, / traffic laws / must be strictly enforced. //\nReckless and drunken drivers / should be punished severely. //\nThird, / communities should do their share / in preventing accidents. //\nFor instance, / driving at night in cities / should be made safer / by well-lighted streets. //", "translation": "交通事故は毎年、非常に多くの人命を奪っています。\n事故が起きたとき、その責任は歩行者よりも運転者側にあることが多いのです。\nでは、こうした事故はどのように防ぐことができるでしょうか。\n第一に、運転者と歩行者は、安全規則を守ることが自分たちの義務であると認識すべきです。\n第二に、交通法規は厳格に施行されなければなりません。無謀な運転者や飲酒運転者は厳しく処罰されるべきです。\n第三に、地域社会も事故防止のために自らの役割を果たすべきです。\n例えば、都市部での夜間運転は、道路を十分に明るくすることによって、より安全なものにすべきです。", "important": "take a life / take lives\n「命を奪う」\na great many ～\n「非常に多くの～」\noccur\n「起こる・発生する」\nthe fault of ～\n「～の責任・過失」\nrather than ～\n「～よりむしろ」\nprevent\n「防ぐ」\nfirst of all\n「まず第一に」\nrealize that ～\n「～ということを認識する」\nduty\n「義務」\nobserve the rules\n「規則を守る」\nstrictly\n「厳格に」\nenforce a law\n「法律を施行する・執行する」\nreckless\n「無謀な」\npunish\n「処罰する」\nseverely\n「厳しく」\ncommunity\n「地域社会」\ndo one's share\n「自分の役割・分担を果たす」\nfor instance\n「例えば」\nwell-lighted\n「十分に照明された」", "extra": [{"title": "英検で使える重要構文", "text": "① rather than\nthe drivers rather than the pedestrians\n「歩行者よりむしろ運転者」\n対比を明確にできます。\nGovernments should invest in renewable energy rather than fossil fuels.\n政府は化石燃料よりも再生可能エネルギーに投資すべきである。\n② It is one's duty to do\nIt is their duty to observe the safety rules.\n「安全規則を守ることは彼らの義務である。」\nIt is the government's duty to protect its citizens.\n国民を守ることは政府の責務である。\n③ 受動態で「対策」を述べる\nTraffic laws must be strictly enforced.\n交通法規は厳格に施行されなければならない。\nReckless drivers should be punished severely.\n無謀な運転者は厳しく処罰されるべきである。\n英検英作文で、\nshould be + 過去分詞\nmust be + 過去分詞\nは政策や社会問題について意見を書くときに非常に便利です。"}, {"title": "特に重要｜英作文の「型」", "text": "この文章は内容だけでなく、文章構成そのものを覚える価値があります。\n問題提起\nHow can these accidents be prevented?\n↓\n理由・対策①\nFirst of all, ...\n↓\n理由・対策②\nSecond, ...\n↓\n理由・対策③\nThird, ...\n↓\n具体例\nFor instance, ...\nこの構造は、英検の意見論述にも応用できます。\n例えば、\nHow can environmental problems be reduced?\nFirst of all, governments should promote renewable energy.\nSecond, companies should reduce waste.\nThird, individuals should change their lifestyles.\nFor instance, people can use public transportation instead of private cars.\nこのように、テーマを変えても同じ骨格を使えます。"}, {"title": "実践ドリル", "text": "Q1\nTraffic accidents (　　　) a great many lives every year.\n<details> <summary>答えを見る<\/summary>\ntake\ntake lives ＝ 命を奪う\n<\/details>\nQ2\nIt is their duty to (　　　) the safety rules.\n<details> <summary>答えを見る<\/summary>\nobserve\nobserve the rules ＝ 規則を守る\n<\/details>\nQ3\nTraffic laws must be strictly (　　　).\n<details> <summary>答えを見る<\/summary>\nenforced\nenforce a law ＝ 法律を施行・執行する\n<\/details>\nQ4\nCommunities should do their (　　　) in preventing accidents.\n<details> <summary>答えを見る<\/summary>\nshare\ndo one's share ＝ 自分の役割を果たす\n<\/details>\nQ5\nThe government should invest in education (　　　) than unnecessary projects.\n<details> <summary>答えを見る<\/summary>\nrather\nrather than ～ ＝ ～よりむしろ\n<\/details>"}, {"title": "内容確認", "text": "Q1. What do traffic accidents take every year?\nQ2. What should drivers and pedestrians realize?\nQ3. What should be done with traffic laws?\nQ4. What should communities do?\nQ5. How can driving at night be made safer?\n<details> <summary>解答を見る<\/summary>\nA1. They take a great many lives.\nA2. They should realize that it is their duty to observe the safety rules.\nA3. They should be strictly enforced.\nA4. They should do their share in preventing accidents.\nA5. Streets should be well lighted.\n<\/details>"}, {"title": "音読トレーニング", "text": "ROUND 1｜意味確認 × 2回\n日本語訳と対応させながら読む。\nROUND 2｜チャンク音読 × 3回\n/ ごとに意味をイメージする。\nROUND 3｜構造を意識 × 3回\nFirst of all → Second → Third → For instance を特に意識する。\nROUND 4｜スピード音読 × 3回\n日本語に訳さず、英語の語順のまま読む。\nROUND 5｜スピーキング × 1回\n本文を閉じて、\nHow can traffic accidents be prevented?\nという質問に、自分の英語で答える。"}, {"title": "今日の一文", "text": "Traffic laws must be strictly enforced.\n「交通法規は厳格に施行されなければならない。」\nさらに、\nCommunities should do their share in preventing accidents.\n「地域社会も事故防止のために自らの役割を果たすべきである。」\nそれぞれ 5回音読する。"}], "special": true}, {"num": 52, "title": "The Bus That Came Too Early", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "Mr. Green took the same bus to work every morning. The bus was almost always five minutes late, so he gradually stopped worrying about arriving at the bus stop on time.\nOne morning, he left home at his usual time and saw his bus disappearing around the corner. For the first time in months, it had arrived exactly on schedule.\nMr. Green complained to the bus company. The employee listened politely and said, “We are very sorry, sir. We will try not to surprise you again.”\nPublic transportation should certainly be punctual. However, Mr. Green also learned that depending on a delay is not a very reliable way to manage one's time.\n重要表現\non time / gradually / disappear around the corner / on schedule / complain / punctual / rely on\nWIT POINT\nバスが定刻に来たことに「苦情」を言う乗客と、「もう驚かせないようにします」という係員。最後には利用者自身にも反省点があります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 53, "title": "A Seat for Someone Else", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "A young man was sitting on a crowded train when an elderly woman entered. He immediately stood up and offered her his seat.\n“Thank you,” she said, “but I'm getting off at the next station.”\nThe young man smiled and sat down again. A few seconds later, the train stopped suddenly, and he nearly fell onto the floor.\nThe woman looked at him and said, “Perhaps you should have kept standing.”\nSmall acts of kindness do not always go according to plan, but they still help create a more considerate society.\n重要表現\ncrowded / elderly / offer one's seat / get off / nearly / according to plan / considerate\nWIT POINT\n親切に席を譲った青年が、結局「立っていた方がよかった」と言われます。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 54, "title": "The Pedestrian Shortcut", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "A city built a beautiful new path to encourage people to walk through a park. The path curved gently around trees and flower beds.\nWithin a few weeks, however, another path appeared. It was not designed by an engineer. It was a narrow line of bare ground created by hundreds of people walking directly across the grass.\nThe city could have put up a sign saying, “Keep Off the Grass.” Instead, officials decided to turn the unofficial route into a real path.\nSometimes good planning begins by observing what people actually do rather than what planners expect them to do.\n重要表現\nencourage / curve / bare ground / put up a sign / official / observe / rather than\nWIT POINT\n歩行者が勝手に作った「近道」を、市が正式な道にしてしまう話です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 55, "title": "The Quiet Car", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "Some railway companies provide quiet cars where passengers are asked not to make phone calls or play loud music.\nOne passenger entered such a car and immediately began speaking loudly on his phone. Another passenger pointed to the sign above him.\n“Oh, I'm sorry,” the man whispered. Then he continued his phone conversation in a whisper for the next twenty minutes.\nTechnically, he had become quieter. Unfortunately, everyone could still hear every word because the entire car was silent.\nRules work best when people understand their purpose, not merely their exact wording.\n重要表現\npassenger / point to / whisper / technically / unfortunately / exact wording\n音読POINT\nRules work best / when people understand their purpose, / not merely their exact wording.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 56, "title": "Why Cities Need Benches", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "A park bench may seem like a very simple piece of public equipment. Yet benches can influence how people use a city.\nOlder people can rest while walking, parents can sit while children play, and strangers may occasionally begin conversations. A street designed only for moving people from one place to another can become a place where people actually spend time.\nOf course, no city has ever become famous simply because it had excellent benches. Still, small improvements can make public spaces more comfortable and welcoming.\n重要表現\npublic equipment / influence / occasionally / public space / welcoming\nWIT POINT\n「ベンチが素晴らしいから世界的観光都市になった」という都市はたぶんありません。しかし、小さな設備が生活を変えます。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 57, "title": "The Problem with Too Many Signs", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "Road signs are intended to give drivers useful information. However, too many signs can sometimes have the opposite effect.\nImagine approaching an intersection and seeing ten different signs at once. One tells you the speed limit, another warns about bicycles, two explain parking rules, and several point toward different destinations.\nBy the time you have read everything, you may have passed the intersection you were trying to find.\nGood information is not simply a matter of providing more information. It must also be presented clearly enough to be understood quickly.\n重要表現\nbe intended to / opposite effect / intersection / speed limit / destination / present information", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 58, "title": "The Bicycle That Was Faster Than a Car", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "A man bought an expensive car because he wanted to shorten his daily commute. The advertisement showed the car moving smoothly along an empty road.\nUnfortunately, his actual city contained other cars.\nEvery morning, he spent nearly an hour in traffic while cyclists passed him on a bicycle lane. One day, he measured the travel time and discovered that cycling was faster.\nThe car was certainly capable of moving much faster than a bicycle. The problem was that capability and reality were not the same thing.\n重要表現\nshorten / commute / advertisement / traffic / cyclist / be capable of / reality\nWIT POINT\n「最高速度」は圧勝でも、「通勤速度」では自転車に敗北します。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 59, "title": "Waiting for the Elevator", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "People sometimes become surprisingly impatient while waiting for an elevator. Thirty seconds can feel much longer when there is nothing to do except watch a closed door.\nSome buildings solve this problem not by making elevators faster but by placing mirrors near them. People look at themselves, adjust their clothes, or simply become distracted.\nAs a result, the waiting time feels shorter even though the elevator has not changed at all.\nThis illustrates an interesting point about public services: improving people's experience does not always require improving the machine itself.\n重要表現\nimpatient / adjust / distracted / as a result / illustrate / public service", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 60, "title": "The Empty Parking Space", "subtitle": "", "theme": "社会・交通", "level": "英検2級", "body": "A driver spent ten minutes searching for a parking space in a crowded shopping area. Finally, he saw an empty one and happily drove toward it.\nAs he got closer, he discovered a very small car already parked there. From a distance, it had been completely hidden between two large vehicles.\nThe driver continued his search, slightly less optimistic than before.\nModern cities need efficient parking systems, but perhaps they also need a warning sign that says, “Small car hiding here.”\n重要表現\nparking space / from a distance / vehicle / optimistic / efficient / warning sign", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 61, "title": "When Everyone Takes the Same Shortcut", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Navigation apps can suggest faster routes by analyzing traffic conditions. This is extremely useful when only a few drivers are directed toward a quiet road.\nA problem arises, however, when thousands of drivers receive the same suggestion. A street that was previously peaceful may suddenly become crowded, and the “shortcut” may no longer save any time.\nThis demonstrates how individual decisions can produce unexpected collective results. A route may be efficient for one driver but inefficient when everyone chooses it.\nTechnology therefore needs to consider not only individual users but also the effects of their combined behavior.\n重要表現\nanalyze / arise / previously / demonstrate / collective / combined behavior", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 62, "title": "The Last Train", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "In cities with extensive railway systems, the last train has an unusual influence on social life. People at restaurants or gatherings may suddenly look at the time and announce that they must leave.\nMissing the final train can turn a pleasant evening into an expensive taxi ride or a very long wait until morning.\nFor this reason, transportation schedules influence behavior in ways that are not always obvious. A timetable may appear to be merely technical information, yet it can determine when meetings end, how long people stay in town, and even where they choose to live.\n重要表現\nextensive / gathering / announce / final / influence behavior / determine", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 63, "title": "The Town with No Traffic Lights", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Traffic lights are so common that removing them may seem dangerous. Nevertheless, some communities have experimented with reducing signs and signals in certain areas.\nThe idea is that when drivers cannot depend entirely on traffic signals, they may pay greater attention to pedestrians, cyclists, and other vehicles.\nSuch systems are not suitable everywhere, and safety must be carefully evaluated. Yet they raise an interesting question: can too many instructions sometimes make people less attentive?\nA rule can guide behavior, but it can also encourage people to stop thinking for themselves.\n重要表現\nexperiment with / entirely / pay attention to / suitable / evaluate / attentive", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 64, "title": "Public Transportation and Freedom", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Cars are often associated with personal freedom because drivers can choose when and where to travel. However, reliable public transportation can also increase freedom.\nA teenager who cannot drive, an elderly person who no longer wishes to drive, or someone who cannot afford a car may depend heavily on buses and trains.\nWhen public transportation is frequent and accessible, people can participate more easily in work, education, shopping, and social activities.\nMobility is therefore not simply about owning a vehicle. It is about having realistic choices for reaching the places that matter.\n重要表現\nbe associated with / reliable / afford / accessible / participate in / mobility", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 65, "title": "The Escalator Debate", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "In many cities, people traditionally stand on one side of an escalator so that those in a hurry can walk past on the other side.\nThis custom seems efficient, but transportation authorities have sometimes encouraged passengers to stand on both sides. Walking on escalators can cause accidents, and using only one side may reduce the total number of people who can be carried.\nThe debate reveals a common conflict in public spaces: what is fastest for one individual may not be most efficient for everyone.\nAnd, of course, the person walking fastest often reaches the platform just in time to watch the train leave.\n重要表現\ntraditionally / in a hurry / authority / reduce / reveal / conflict / efficient\nWIT POINT\n一生懸命エスカレーターを歩いても、目の前で電車が出れば努力は帳消しです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 66, "title": "Why Streets Need Trees", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Street trees are sometimes treated mainly as decoration, but they perform several practical functions. They provide shade, reduce heat around buildings, absorb some air pollution, and make walking more pleasant.\nTrees can also influence how people perceive a street. A road surrounded only by concrete may feel like a route to pass through, while a tree-lined street can invite people to slow down.\nHowever, urban trees require maintenance and careful planning. Roots, falling branches, and limited space can create difficulties.\nA successful city must therefore treat trees not simply as decoration but as part of its infrastructure.\n重要表現\ndecoration / practical / shade / absorb / perceive / maintenance / infrastructure", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 67, "title": "The Cost of Free Parking", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Free parking sounds as if it costs nothing. In reality, parking spaces require land, construction, maintenance, and management.\nWhen shops or public facilities provide parking without charging drivers directly, these costs may be included in the prices paid by everyone, including people who arrive on foot or by public transportation.\nThis does not mean that all parking should be expensive. Rather, it shows that the word “free” can hide costs instead of eliminating them.\nEconomists often remind us that when something appears to be free, it is worth asking who is actually paying.\n重要表現\nin reality / directly / include / eliminate / economist / be worth ～ing", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 68, "title": "A City Designed for Children", "subtitle": "", "theme": "社会・交通", "level": "英検2級→準1級", "body": "Urban planners sometimes ask an unusual question: if a city is safe and comfortable for a child, will it also be better for adults?\nChildren need safe crossings, slower traffic, accessible parks, and places where they can move without constant danger. Many of these features also benefit older people and adults with disabilities.\nDesigning for children therefore encourages planners to think about people who are more vulnerable to traffic and physical barriers.\nA city that works only for healthy adults moving quickly from place to place may be efficient, but it is not necessarily welcoming to everyone.\n重要表現\nurban planner / crossing / accessible / disability / vulnerable / barrier", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 69, "title": "Why People Ignore Warnings", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Warnings are useful only if people pay attention to them. Unfortunately, environments filled with warning messages can produce the opposite result.\nIf every door, machine, road, and package contains several warnings, people may begin to treat them as background information. Psychologists sometimes refer to this phenomenon as warning fatigue.\nEffective safety communication therefore requires judgment. The most important warnings must be visible and specific enough to attract attention.\nWriting “CAUTION” on everything may protect an organization legally, but it does not necessarily make anyone more cautious.\n重要表現\nbackground information / refer to A as B / phenomenon / fatigue / specific / cautious\nWIT POINT\n何にでも「注意！」と書けば、最後には「注意という文字」に誰も注意しなくなります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 70, "title": "The Psychology of a Queue", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Waiting in line is a surprisingly complex social activity. In many societies, people accept the principle that those who arrive first should be served first.\nProblems arise when the order is unclear. Someone who appears to enter ahead of others may cause irritation even if the actual delay is only a few seconds.\nPeople also dislike unexplained waiting. A ten-minute wait can feel shorter when they know why it is happening and how long it will probably continue.\nManaging a queue, therefore, is partly about managing time and partly about managing people's sense of fairness.\n重要表現\nprinciple / arise / irritation / actual / unexplained / sense of fairness", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 71, "title": "The Unintended Effects of Rules", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Rules are usually introduced to encourage or prevent particular behavior. Yet people often adjust their actions in ways that rule makers did not anticipate.\nSuppose a company begins charging employees who arrive late. The policy is intended to improve punctuality. Some employees, however, may begin to view the charge as a fee that gives them permission to be late.\nThe rule has changed the meaning of the behavior rather than eliminating it.\nThis is why effective policy requires more than identifying undesirable behavior. Policymakers must also consider how people are likely to respond to the incentives they create.\n重要表現\nanticipate / suppose / punctuality / permission / eliminate / undesirable / incentive", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 72, "title": "Should City Centers Be Car-Free?", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Some cities have restricted private cars in central areas in an attempt to reduce congestion, pollution, and accidents. Supporters argue that streets become more pleasant when additional space is available for pedestrians, bicycles, and public transportation.\nCritics, however, worry that restrictions may inconvenience residents, older people, and businesses that depend on deliveries.\nThe issue is therefore more complicated than simply being “for” or “against” cars. Successful policies need alternatives that allow people and goods to move efficiently.\nRemoving cars without improving other forms of transportation may simply replace one problem with another.\n重要表現\nrestrict / congestion / supporter / critic / inconvenience / alternative", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 73, "title": "Technology and Traffic Safety", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Modern vehicles increasingly contain systems designed to prevent accidents. Cameras can detect obstacles, sensors can warn drivers when they leave a lane, and automatic braking can react faster than a person in certain situations.\nThese technologies can improve safety, but they may create a new risk if drivers become overly dependent on them. A system intended to assist a driver should not become an excuse to stop paying attention.\nThis is a recurring problem with automation. As machines become more capable, humans may become less prepared for the rare moment when the machine fails.\n重要表現\nincreasingly / detect / sensor / automatic braking / overly dependent / recurring / automation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 74, "title": "The Fifteen-Minute City", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "The concept of a “fifteen-minute city” proposes that many daily needs should be available within a short walk or bicycle ride from people's homes.\nSchools, shops, parks, medical services, and public transportation would be distributed throughout neighborhoods rather than concentrated in distant locations.\nSupporters argue that this approach can reduce unnecessary car journeys and improve local communities. Critics point out that existing cities cannot always be reorganized easily.\nThe idea is useful, however, because it asks a basic question: how much of our daily life should require a long journey?\nSometimes the best transportation policy is to make transportation unnecessary.\n重要表現\nconcept / propose / distribute / concentrate / approach / reorganize / unnecessary\nWIT POINT\n最も速い交通手段を探し続けた末に、「そもそも移動しなくてよい街」という発想に戻ります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 75, "title": "A Faster World That Still Waits", "subtitle": "", "theme": "社会・交通", "level": "英検準1級", "body": "Transportation has become dramatically faster over the past two centuries. Journeys that once required weeks can now be completed in hours. Digital technology has accelerated communication even more.\nYet modern people still spend a remarkable amount of time waiting: in traffic jams, at airports, on railway platforms, in queues, and for delayed deliveries.\nThis apparent contradiction suggests that speed alone does not eliminate waiting. Faster systems often encourage people to travel farther, schedule more activities, and expect quicker results.\nPerhaps progress should not be measured only by how fast we can move. It might also be measured by how much unnecessary waiting and movement we can avoid.\nAfter all, arriving five minutes earlier is not especially impressive if we spend those five minutes looking at our phones.\n重要表現\ndramatically / accelerate / remarkable / apparent contradiction / eliminate / measure / avoid\n音読POINT\nPerhaps progress should not be measured
