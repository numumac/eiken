 product suddenly rises.\nPrices can change for many reasons. Raw materials may become more expensive, transportation costs may rise, demand may increase, or supply may fall because of poor weather or other disruptions.\nA price therefore contains information about many parts of an economic system.\nHowever, understanding why a price increased does not necessarily make paying it more enjoyable.\nEconomics can explain why tomatoes cost more this week. It cannot make the customer happier about the salad.\n重要表現\nraw material / demand / supply / disruption / economic system / necessarily", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 163, "title": "The Problem with “Free”", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "People naturally like the word “free.” Yet a service can be free to the user without being free to provide.\nCompanies may pay for a service through advertising, subscriptions from other users, or the collection of valuable data. Public services may be funded through taxes.\nThis does not mean that a free service is necessarily bad. It means that users should understand the economic model supporting it.\nA useful question is: if I am not paying directly, who is?\nSometimes there is a clear answer. Sometimes the answer is complicated. And sometimes part of the answer may be “your attention.”\n重要表現\nadvertising / subscription / collection / fund / economic model / directly / attention", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 164, "title": "Productivity Is Not Busyness", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "A person can spend an entire day answering messages, attending meetings, organizing files, and moving rapidly between tasks while accomplishing very little of lasting importance.\nThis illustrates the difference between activity and productivity.\nProductivity concerns the value of what is produced, not simply the amount of visible effort. Some important work requires long periods of quiet thought that may not look busy at all.\nModern workplaces sometimes reward the appearance of activity because it is easier to observe.\nTyping quickly looks productive.\nThinking quietly can look suspiciously like doing nothing.\n重要表現\naccomplish / lasting / productivity / concern / visible / appearance / observe\nWIT POINT\nキーボードを猛烈に叩いている人と、窓を見ながら考えている人。どちらが仕事をしているかは見た目だけでは分かりません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 165, "title": "Why Specialization Works", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "Modern economies depend heavily on specialization. Instead of producing everything they need themselves, people concentrate on particular skills and exchange the results of their work.\nA skilled mechanic can repair cars more efficiently than most drivers. A farmer can produce food for many people, while engineers, teachers, doctors, and countless others perform different roles.\nSpecialization can increase efficiency, but it also creates interdependence.\nVery few people today could independently produce their own food, electricity, clothing, medicine, and smartphone.\nEspecially the smartphone.\n重要表現\nspecialization / concentrate on / skilled / efficiency / interdependence / independently", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 166, "title": "The Value of Experience", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "An experienced worker may complete a task quickly and make it look easy. This sometimes leads observers to underestimate the skill involved.\nA repair technician, for example, may identify a problem in five minutes. A customer might wonder why such a short visit costs so much.\nBut the customer is not paying only for five minutes of work. The technician may be applying knowledge developed over many years.\nExpertise often has an unusual economic characteristic: the better someone becomes at a task, the less time the task may appear to require.\nWe should be careful not to confuse speed with lack of effort.\n重要表現\nexperienced / underestimate / technician / identify / apply / expertise / characteristic", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 167, "title": "When Efficiency Goes Too Far", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "Businesses naturally try to reduce unnecessary costs. Efficient systems can provide products more cheaply and use fewer resources.\nHowever, a system with no extra capacity may become vulnerable when something unexpected occurs. A factory that keeps almost no spare parts may operate efficiently under normal conditions but stop completely when deliveries are delayed.\nThis illustrates the difference between efficiency and resilience.\nKeeping some extra capacity may appear wasteful until the day it is needed.\nAn umbrella is also inefficient on every sunny day.\n重要表現\ncapacity / vulnerable / spare / operate / resilience / wasteful\nWIT POINT\n「使っていない余裕＝無駄」とは限りません。傘も晴天の日だけ評価すれば完全な無駄です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 168, "title": "The Strange Power of Numbers", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "Numbers can make information appear objective and precise.\nA company may announce that customer satisfaction is 87 percent, productivity increased by 4.3 percent, or a product is preferred by two out of three users.\nSuch figures can be useful, but they also invite questions. How was satisfaction measured? Compared with what period did productivity increase? How many people were surveyed?\nA number is not automatically meaningful simply because it contains a decimal point.\nSometimes 87.3 percent looks more scientific than “most people,” even when the underlying evidence is weak.\n重要表現\nobjective / precise / satisfaction / figure / survey / decimal point / underlying", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 169, "title": "Why Good Workers Sometimes Leave", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "Organizations often assume that salary is the main factor determining whether employees remain in a job. Pay is certainly important, but people also care about respect, autonomy, opportunities to develop, relationships with colleagues, and the meaning of their work.\nAn employee who feels constantly ignored or overloaded may leave even if the salary is relatively attractive.\nReplacing experienced staff can itself be expensive because organizations lose knowledge and must recruit and train new employees.\nKeeping good workers therefore requires more than paying them enough not to leave.\nPeople are economic beings, but they are not only economic beings.\n重要表現\nfactor / autonomy / colleague / overloaded / recruit / economic being", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 170, "title": "When Incentives Backfire", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "Financial incentives are often used to encourage particular behavior. Yet poorly designed incentives can produce unexpected results.\nSuppose employees receive bonuses based entirely on the number of tasks they complete. They may naturally begin choosing easy tasks and avoiding difficult ones, even when the difficult tasks are more important.\nPeople respond to what is measured and rewarded.\nFor this reason, an incentive should be evaluated not only by the behavior it is intended to encourage but also by the behavior it may accidentally create.\nIf you reward people for counting nails, do not be surprised when the organization becomes extremely good at counting nails.\n重要表現\nincentive / bonus / entirely / evaluate / accidentally / reward", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 171, "title": "Economic Growth and Well-Being", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "Economic growth can improve living standards by increasing income, employment, public revenue, and access to goods and services.\nHowever, economic output alone does not capture every aspect of human well-being. Health, leisure, environmental quality, security, social relationships, and inequality also influence people's lives.\nThis does not make economic growth unimportant. Rather, it suggests that no single measure can describe an entire society.\nA country can produce more goods without automatically producing more happiness.\nUnfortunately, happiness is considerably harder to put into a shipping container.\n重要表現\nliving standard / revenue / economic output / well-being / inequality / measure", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 172, "title": "Global Supply Chains", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "A product sold in one country may depend on materials, components, workers, factories, software, transportation, and financial services located across many countries.\nThese global supply chains can reduce costs and allow firms to benefit from specialized production.\nThey can also create vulnerability. A natural disaster, political conflict, shipping disruption, or factory closure in one region may affect businesses thousands of kilometers away.\nConsumers often see only the final product on a shelf.\nBehind it may be a journey so complicated that the product itself probably knows more geography than its owner.\n重要表現\ncomponent / supply chain / specialized / vulnerability / disruption / closure", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 173, "title": "Automation and the Future of Work", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "Automation has repeatedly changed the nature of work. Machines replaced some forms of physical labor, computers transformed office tasks, and artificial intelligence is now affecting activities once considered difficult to automate.\nPredictions about mass unemployment should be treated cautiously because technology can both eliminate tasks and create new ones.\nHowever, transitions can still be painful. Workers whose skills become less valuable cannot instantly move into newly created occupations.\nThe central challenge may therefore be adaptation rather than simply the total number of jobs.\nThe future of work will probably contain fewer people doing some old tasks and more people complaining about entirely new tasks.\n重要表現\ntransform / mass unemployment / cautiously / transition / occupation / adaptation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 174, "title": "What Makes Work Meaningful?", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "People work partly because they need income, but work can also provide identity, social relationships, achievement, and a sense of contributing to something beyond oneself.\nNot every task needs to be deeply meaningful. Society depends on many ordinary jobs that simply need to be done.\nProblems arise, however, when workers feel that their effort serves no understandable purpose or is never recognized.\nMeaningful work does not necessarily require changing the world.\nSometimes it means being able to see who benefits from what you do and knowing that the work has been done well.\nA perfectly completed small task can provide more satisfaction than an impressive job title printed on a business card.\n重要表現\nidentity / achievement / contribute to / arise / recognize / satisfaction / job title", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 175, "title": "What Is the Economy For?", "subtitle": "", "theme": "経済・仕事", "level": "英検準1級", "body": "Economic discussions often focus on growth, productivity, prices, employment, trade, and investment. These are important subjects, but they are ultimately connected with a more basic question: what is an economy supposed to achieve?\nAn economy is not a machine operating independently of society. It is a system through which people produce, exchange, and distribute resources.\nEfficiency matters because resources are limited. Growth matters because greater productive capacity can improve living conditions. Yet fairness, stability, opportunity, and environmental sustainability also matter.\nEconomic statistics are therefore tools for understanding society, not the final purpose of society itself.\nPerhaps the economy is working well when people have the resources and opportunities to build worthwhile lives.\nAfter all, nobody wakes up in the morning hoping personally to increase gross domestic product by 0.003 percent before breakfast.\n重要表現\nultimately / distribute / productive capacity / stability / sustainability / statistic / worthwhile / gross domestic product\n音読POINT\nEconomic statistics are therefore / tools for understanding society, / not the final purpose / of society itself.\nPerhaps the economy is working well / when people have the resources and opportunities / to build worthwhile lives.\nWIT POINT\n最後はGDPそのものを目的化しない、という少し大きな問いです。「朝食前にGDPを0.003％上げよう」と起きる人はいない、という一文で締めました。\n第8分野｜医療・健康", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 176, "title": "Why Do We Need Sleep?", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "People spend about one-third of their lives sleeping, so it may seem surprising that scientists still have questions about exactly why sleep is necessary.\nSleep is associated with many important processes. The brain organizes information, the body performs various forms of maintenance, and adequate sleep supports attention and performance during the day.\nPeople sometimes treat sleep as time that can be sacrificed when they are busy. However, reducing sleep may make the remaining hours less productive.\nStaying awake longer does not necessarily give us more useful time.\nSometimes the most productive thing a tired person can do is stop being productive and go to bed.\n重要表現\nbe associated with / process / maintenance / adequate / sacrifice / productive / necessarily\nWIT POINT\n「時間がないから睡眠を削る」と、起きている時間の能率まで落ちることがあります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 177, "title": "The Alarm Clock Problem", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Many people set an alarm because they need to wake up at a particular time. Some also press the snooze button repeatedly.\nThis creates an interesting morning negotiation.\nThe person who set the alarm the night before clearly believed that getting up at seven was important. The person who hears it at seven suddenly has a different opinion.\nSleepiness can affect judgment, which helps explain why decisions made late at night or immediately after waking may not always seem wise later.\nAn alarm clock therefore produces a daily debate between two versions of the same person.\nThe evening version usually has better plans. The morning version has access to the snooze button.\n重要表現\nparticular / repeatedly / negotiation / judgment / immediately / version\nWIT POINT\n「昨夜の自分」と「朝の自分」の意見が毎朝対立します。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 178, "title": "Why Exercise Feels Difficult at First", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Someone who begins exercising after a long period of inactivity may be surprised by how difficult a simple activity feels.\nThe body needs time to adapt to increased physical demands. With regular training, the heart, muscles, and other systems can become better prepared for activity.\nThis is one reason gradual improvement is often more realistic than expecting immediate results.\nPeople sometimes stop exercising because the first few sessions feel unpleasant.\nUnfortunately, the body does not read our New Year's resolutions and instantly become fit on January 1.\nAdaptation requires time.\n重要表現\ninactivity / adapt / physical demand / regular / gradual / immediate / adaptation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 179, "title": "The Elevator or the Stairs?", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Modern life contains many technologies designed to reduce physical effort. Elevators, cars, remote controls, and delivery services make daily life more convenient.\nThe result is that people may need to create opportunities for movement that earlier generations received automatically.\nChoosing stairs instead of an elevator is a small example. One trip up a staircase will not transform anyone's health, but repeated habits can influence overall activity.\nThere is something slightly ironic about driving to a gym in order to walk on a machine.\nConvenience saves effort. Sometimes we then pay money to put the effort back.\n重要表現\nphysical effort / convenient / opportunity / automatically / transform / overall / ironic", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 180, "title": "Why Water Matters", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Water is essential for the human body. It participates in many processes, including temperature regulation, transportation of substances, and normal cellular function.\nThe amount of fluid a person needs varies according to factors such as activity, environment, diet, and individual conditions.\nThis is why simple claims that every person must drink exactly the same amount each day can be misleading.\nThe human body is complicated enough that it rarely follows a rule printed neatly on a social-media picture.\nGeneral advice can be useful, but individual circumstances still matter.\n重要表現\nessential / participate in / regulation / cellular / vary / factor / misleading", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 181, "title": "Why We Like Sweet Food", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Humans naturally tend to enjoy sweet tastes. From an evolutionary perspective, sweetness often indicated foods containing useful energy.\nIn modern societies, however, highly sweetened products can be available almost everywhere and in quantities very different from those encountered by our ancestors.\nThis creates an interesting mismatch between ancient preferences and modern environments.\nOur brains developed in a world where finding concentrated sources of energy could be valuable.\nThey did not develop while standing in front of a convenience-store shelf containing thirty kinds of dessert.\nEvolution prepared us for many things. The chocolate aisle was not one of them.\n重要表現\ntend to / evolutionary / indicate / quantity / ancestor / mismatch / concentrated", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 182, "title": "The Problem with Sitting", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Many modern jobs require people to remain seated for long periods. Computers have reduced the need to move around in many workplaces.\nRegular physical activity is important, but daily patterns of movement also matter. Standing, walking, stretching, and taking short breaks can add movement to an otherwise inactive day.\nThe goal does not need to be turning every office into a gym.\nSometimes the first improvement is simply remembering that the human body contains legs.\nA computer may be designed to remain on a desk for eight hours.\nIts user was not.\n重要表現\nremain seated / physical activity / pattern / stretch / inactive / be designed to", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 183, "title": "Why Laughter Feels Good", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Laughter is a complex human behavior involving the brain, breathing, facial muscles, and social communication.\nPeople often laugh in groups, and laughter can strengthen social connections. Humor may also help people cope with uncomfortable or stressful situations.\nThis does not mean laughter is a medical treatment for every problem. Serious health conditions require appropriate care.\nStill, humor can make difficult moments easier to manage.\nIt is one of the few human activities in which losing control for several seconds can sometimes improve a conversation.\n重要表現\ncomplex / involve / strengthen / cope with / stressful / appropriate / manage", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 184, "title": "The Healthy Food That Nobody Eats", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "Nutrition advice sometimes focuses on identifying the healthiest possible foods. However, food provides no nutritional benefit if people dislike it so much that they never eat it.\nRealistic eating habits need to consider nutrition, culture, cost, availability, convenience, and personal preference.\nA theoretically perfect diet that cannot be maintained may be less useful than a reasonably healthy pattern that fits everyday life.\nThis illustrates a broader principle in health behavior: a good plan must work outside the textbook.\nThe world's healthiest vegetable has limited power while remaining untouched at the back of the refrigerator.\n重要表現\nnutrition / availability / preference / theoretically / maintain / principle", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 185, "title": "Why Habits Are Powerful", "subtitle": "", "theme": "医療・健康", "level": "英検2級", "body": "People make many small decisions every day. If each action required careful thought, daily life would become exhausting.\nHabits allow familiar behaviors to occur with less conscious decision-making. This can be helpful when the habit is beneficial and frustrating when it is not.\nChanging a habit therefore often involves changing the situations and signals that trigger it, not simply deciding to “try harder.”\nWillpower matters, but environment matters too.\nKeeping biscuits beside your desk while repeatedly promising not to eat them is an interesting experiment in human optimism.\n重要表現\nexhausting / conscious / beneficial / trigger / willpower / optimism", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 186, "title": "Stress Is Not Always the Enemy", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "Stress is often discussed as if it were entirely harmful. In reality, the body's stress response can be useful.\nWhen people face a challenge, physiological changes can increase alertness and prepare the body to respond. Short-term stress before an examination or presentation may help someone focus.\nProblems can arise when stress becomes excessive, prolonged, or difficult to manage.\nThe goal, therefore, is not necessarily to eliminate every form of stress from life.\nA life containing absolutely no challenges might be peaceful.\nIt might also be extremely boring.\n重要表現\nentirely / physiological / alertness / short-term / excessive / prolonged / eliminate", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 187, "title": "Why Rest Is Part of Training", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "People who want to improve their physical performance may assume that more training always produces better results.\nHowever, exercise places stress on the body, and recovery is part of the process through which adaptation occurs. Training without adequate recovery can interfere with performance.\nThis principle can seem psychologically difficult because resting may feel like doing nothing.\nYet improvement does not occur only during visible effort.\nA musician needs pauses between notes, and an athlete needs recovery between training sessions.\nSometimes progress requires knowing when to stop.\n重要表現\nassume / recovery / adequate / interfere with / psychologically / visible effort", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 188, "title": "The Internet Doctor", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "The internet gives people access to an enormous amount of health information. This can help patients learn useful questions to ask and understand unfamiliar terminology.\nHowever, online information varies greatly in quality. Symptoms can have many possible causes, and general information cannot automatically determine what is happening to a particular individual.\nSearching repeatedly can also increase anxiety when dramatic explanations receive more attention than ordinary ones.\nThe internet is excellent at finding information.\nIt is less good at placing a reassuring hand on your shoulder and saying, “There are several possibilities. Let's examine this properly.”\n重要表現\naccess / terminology / vary in quality / symptom / determine / particular / anxiety", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 189, "title": "Why Medical Tests Are Not Perfect", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "People sometimes imagine medical tests as machines that simply reveal whether a condition is present or absent.\nIn reality, tests have limitations. A test may occasionally indicate a problem when none is present, or fail to detect a condition that actually exists.\nDoctors therefore interpret test results together with symptoms, medical history, examination findings, and other information.\nA number printed on a laboratory report can be important, but it rarely tells the entire story by itself.\nMedicine involves measurement, but it also involves interpretation.\n重要表現\nreveal / limitation / indicate / detect / interpret / medical history / laboratory", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 190, "title": "The Placebo Effect", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "A placebo is a treatment that does not contain the specific active component being studied. Placebos are often used in research to help scientists separate the effects of a treatment from other influences.\nInterestingly, people's expectations and the context of receiving care can sometimes affect how they report or experience certain symptoms.\nThis does not mean that illness is imaginary or that positive thinking can cure every disease.\nRather, it demonstrates that the relationship between mind, body, expectation, and treatment can be complex.\nThe brain is part of the body, after all. It did not sign a contract agreeing to stay out of medical research.\n重要表現\nplacebo / active component / separate / expectation / imaginary / demonstrate", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 191, "title": "Prevention Is Hard to Notice", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "Preventive measures have an unusual problem: when they work, nothing dramatic may happen.\nVaccination, sanitation, safety measures, screening programs, and healthy behaviors may reduce risks before serious problems develop.\nBecause the prevented event never occurs, people may underestimate the value of prevention.\nRepairing a visible problem often feels more impressive than preventing an invisible one.\nA firefighter who puts out a fire is obviously useful.\nThe person whose careful work prevented the fire from starting may receive no applause at all.\n重要表現\npreventive / sanitation / screening / reduce risk / underestimate / prevention", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 192, "title": "Why Health Headlines Can Mislead", "subtitle": "", "theme": "医療・健康", "level": "英検2級→準1級", "body": "Health research is complicated, but headlines need to attract attention quickly.\nAs a result, a study suggesting a possible association may become a headline claiming that a particular food “causes” or “prevents” a disease.\nImportant details can disappear: How large was the study? Was it conducted on humans? How strong was the effect? Has the result been repeated?\nReaders should therefore be cautious about dramatic conclusions based on a single study.\nScience usually advances through accumulated evidence.\nHeadlines prefer to advance before lunch.\n重要表現\nheadline / association / conduct / effect / cautious / conclusion / accumulated evidence\nWIT POINT\n科学は慎重ですが、見出しは待ってくれません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 193, "title": "Correlation in Health Research", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Suppose researchers observe that people who regularly perform a certain activity tend to have better health outcomes.\nThis does not automatically prove that the activity caused the improvement.\nPerhaps people who perform the activity also differ in income, diet, education, age, or other important factors. Researchers attempt to control for such variables, but observational studies can be difficult to interpret.\nThis is why the distinction between correlation and causation is especially important in health research.\nHuman beings want clear answers.\nBiology frequently replies, “It depends.”\n重要表現\nhealth outcome / automatically / factor / control for / variable / observational / causation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 194, "title": "Why Antibiotics Do Not Treat Every Infection", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Antibiotics are medicines used against bacterial infections. They do not work against viruses in the same way.\nUnnecessary or inappropriate antibiotic use can also contribute to antimicrobial resistance, in which microorganisms become less susceptible to medicines that were previously effective.\nThis is a serious public-health challenge because effective antibiotics are important for many areas of modern medicine.\nThe lesson is not that antibiotics are bad. Their usefulness is precisely why they need to be used appropriately.\nA powerful tool remains powerful longer when we do not use it for jobs it cannot perform.\n重要表現\nbacterial / inappropriate / contribute to / antimicrobial resistance / susceptible / precisely", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 195, "title": "Why One Study Is Not Enough", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "A scientific study can provide valuable evidence, but a single study rarely settles an important medical question.\nResults may be influenced by sample size, research methods, chance, or characteristics of the participants. Other researchers therefore attempt to reproduce findings and compare them with evidence from additional studies.\nOver time, a stronger picture can emerge.\nThis process may appear frustratingly slow, especially when people want immediate answers about health.\nBut scientific caution is not necessarily weakness.\nSometimes saying “we need more evidence” is more responsible than confidently giving an answer that has not yet been established.\n重要表現\nsettle a question / sample size / participant / reproduce / emerge / caution / establish", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 196, "title": "Artificial Intelligence in Medicine", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Artificial intelligence is increasingly being used to analyze medical images, organize information, identify patterns, and assist clinical decision-making.\nSuch systems may help professionals process large amounts of data more efficiently. However, performance depends on factors including the quality of training data and the circumstances in which a system is used.\nQuestions of privacy, bias, accountability, and human oversight also remain important.\nThe goal need not be to choose between doctors and machines.\nA more useful question may be how each can compensate for the limitations of the other.\nAfter all, neither humans nor computers have achieved the medically useful condition known as “never making a mistake.”\n重要表現\nclinical / decision-making / circumstance / privacy / bias / accountability / oversight / compensate for", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 197, "title": "Who Should Receive Limited Medical Resources?", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Medical resources are not unlimited. Hospitals have finite numbers of professionals, beds, equipment, medicines, and available hours.\nThis creates difficult ethical and economic questions about how resources should be allocated.\nShould priority depend on urgency, expected benefit, waiting time, age, cost, or some combination of factors?\nThere may be no solution that feels perfectly fair in every case.\nHealthcare policy therefore involves more than medical science. It also requires societies to consider values, fairness, and responsibility.\nMedicine can sometimes tell us what is technically possible.\nIt cannot by itself decide what society ought to prioritize.\n重要表現\nfinite / ethical / allocate / priority / urgency / combination / healthcare policy", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 198, "title": "Health Inequality", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Health is influenced not only by medical care but also by social and economic conditions.\nIncome, education, housing, working conditions, access to nutritious food, environmental quality, and social support can all affect health opportunities and risks.\nAs a result, two people living in the same country may face very different conditions for maintaining good health.\nThis is why public-health discussions often extend far beyond hospitals and doctors.\nA prescription may help treat an illness, but it cannot repair poor housing, provide a safe workplace, or eliminate poverty.\nHealth policy therefore overlaps with many other areas of society.\n重要表現\nworking conditions / nutritious / social support / maintain / public health / prescription / overlap", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 199, "title": "When Healthy Living Becomes Unhealthy", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Interest in health can encourage beneficial habits. However, excessive concern about optimizing every detail of life can itself become stressful.\nPeople may try to measure every step, calorie, hour of sleep, heartbeat, and minute of exercise. Data can be useful, but numbers are tools rather than the purpose of living.\nThere is a difference between using information to support health and allowing health measurements to dominate everyday life.\nHuman beings are biological organisms, not permanent research projects.\nIf worrying about perfect health occupies every waking hour, the pursuit of health may have begun to interfere with living.\n重要表現\nbeneficial / excessive / optimize / measurement / dominate / pursuit / interfere with\nWIT POINT\n「健康になるための生活」が「健康管理だけをする生活」になっては本末転倒です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 200, "title": "What Does It Mean to Be Healthy?", "subtitle": "", "theme": "医療・健康", "level": "英検準1級", "body": "Health is sometimes imagined simply as the absence of disease. In everyday life, however, people often think about health more broadly.\nPhysical ability, mental well-being, social relationships, independence, living conditions, and the ability to participate in meaningful activities can all influence how people experience their health.\nAt the same time, no human body remains in a perfect state forever. Aging, temporary illness, injury, and physical limitations are parts of human life.\nThis suggests that health should not always be understood as achieving a flawless body.\nIt may also involve maintaining function, adapting to change, reducing avoidable risks, and living meaningfully within the conditions we have.\nMedical science can help people live longer and better.\nBut the final purpose of health is not simply to produce excellent medical statistics.\nIt is to make living possible.\n重要表現\nabsence / well-being / independence / meaningful / limitation / flawless / adapt / avoidable\n音読POINT\nThis suggests that health / should not always be understood / as achieving a flawless body.\nIt may also involve / maintaining function, / adapting to change, / reducing avoidable risks, / and living meaningfully / within the conditions we have.\nWIT POINT\n第8分野の最後なので、「健康数値を良くすること」から一段上がり、そもそも何のための健康なのかまで考える文章にしました。\n第9分野｜教育・学習", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 201, "title": "Why Do We Forget?", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Students sometimes become disappointed when they cannot remember something they studied only a few days earlier.\nHowever, forgetting is a normal part of human memory. The brain receives enormous amounts of information every day and cannot keep everything equally available.\nReview helps strengthen memories, especially when it occurs repeatedly over time.\nForgetting something does not necessarily mean that the original study was wasted. Relearning information can often be faster than learning it for the first time.\nPerhaps forgetting is not the opposite of learning.\nSometimes it is simply an invitation to meet the information again.\n重要表現\nbe disappointed / memory / enormous / strengthen / repeatedly / relearn / invitation\nWIT POINT\n忘れたら「勉強が無駄だった」のではありません。「また会いましたね」と復習すればよいわけです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 202, "title": "The Night before the Exam", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "The night before an important examination, a student may suddenly discover an extraordinary ability to become interested in everything except studying.\nThe desk needs cleaning. A message needs answering. A book that has been untouched for six months suddenly looks fascinating.\nThis behavior is a form of procrastination. Difficult or stressful tasks are easy to postpone because doing something else provides temporary relief.\nOne solution is to divide a large task into smaller actions.\n“Study everything tonight” sounds frightening.\n“Study these five pages now” sounds possible.\nUnfortunately, the desk will still look unusually interesting.\n重要表現\nextraordinary / fascinating / procrastination / postpone / temporary / divide A into B", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 203, "title": "Why Short Reviews Work", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Many learners believe that studying for several hours at once must be more effective than studying for a few minutes.\nLong study sessions can certainly be useful, but short reviews repeated over time have an important advantage. Each review asks the brain to find the information again.\nThis repeated retrieval can help strengthen memory.\nTen minutes may seem too short to accomplish anything important. Yet ten minutes repeated regularly becomes a considerable amount of learning.\nThe difficulty is that small daily efforts are not dramatic.\nNobody makes a movie about a student reviewing vocabulary for fifteen minutes every morning.\nIt works anyway.\n重要表現\nat once / effective / retrieval / regularly / considerable / dramatic", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 204, "title": "Reading Aloud", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Reading aloud requires a learner to see words, process their meaning, produce sounds, and continue through a sentence at an appropriate rhythm.\nFor language learners, this can connect written English with its spoken form.\nRepeated reading can also make common patterns more familiar. A sentence that initially feels difficult may gradually become easier to produce.\nHowever, simply producing sounds without understanding the meaning has limitations. Good practice combines pronunciation with comprehension.\nThe goal is not to become a human audio player.\nIt is to make English easier for the brain and mouth to handle together.\n重要表現\naloud / process / appropriate / pattern / initially / comprehension / limitation\n音読POINT\nThe goal is not / to become a human audio player. / It is to make English easier / for the brain and mouth / to handle together.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 205, "title": "Why Speaking Feels Harder Than Reading", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "A learner may understand a sentence immediately when reading it but struggle to produce the same idea in conversation.\nRecognition and production are different skills.\nWhen reading, the words are already present. When speaking, the learner must select vocabulary, organize grammar, produce sounds, and respond quickly.\nThis is why speaking practice remains important even for people with strong reading skills.\nKnowing a word when you see it is useful.\nBeing able to find it inside your own head within two seconds is another achievement entirely.\n重要表現\nimmediately / struggle to / recognition / production / select / respond / achievement", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 206, "title": "The Vocabulary Notebook", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Many language learners have owned beautiful vocabulary notebooks.\nThe first few pages are carefully organized. Words are written neatly, examples are added, and important expressions are highlighted.\nThen, somewhere around page twelve, the handwriting becomes faster.\nBy page twenty, several weeks may pass between entries.\nA notebook is useful only when learners return to the information inside it. Creating learning materials can feel productive, but using them repeatedly is what produces learning.\nThe most beautiful vocabulary notebook in the world cannot remember the words on behalf of its owner.\n重要表現\ncarefully / neatly / highlight / entry / productive / on behalf of\nWIT POINT\n教材作りそのものが趣味にならないように、という戒めでもあります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 207, "title": "Is Memorization Bad?", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Memorization is sometimes criticized as the opposite of real understanding. However, the relationship is more complicated.\nCertain facts, words, formulas, and patterns need to be remembered before they can be used fluently. At the same time, memorizing information without understanding how it connects to other ideas can limit learning.\nThe useful question is therefore not whether students should memorize.\nIt is what they should memorize and what they should understand.\nMemory provides material for thought.\nIt is difficult to think deeply about knowledge that is never available when we need it.\n重要表現\nmemorization / criticize / formula / fluently / connect / material for thought", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 208, "title": "Why Making Mistakes Helps", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Students naturally prefer correct answers. Mistakes can feel embarrassing, especially when other people can see them.\nYet an error can reveal exactly where understanding is incomplete.\nWhen learners examine why an answer was wrong and correct the misunderstanding, the mistake becomes useful information.\nThis does not mean students should intentionally make errors. It means that errors should be investigated rather than simply hidden.\nA wrong answer followed by careful correction may teach more than a lucky correct answer.\nThe uncomfortable moment of thinking, “Why did I choose that?” can be surprisingly educational.\n重要表現\nembarrassing / error / reveal / incomplete / intentionally / investigate / correction", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 209, "title": "The Answer That Looked Familiar", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "Multiple-choice questions can create an interesting problem. A learner sees one option and thinks, “I remember seeing this somewhere.”\nUnfortunately, familiarity is not the same as correctness.\nA wrong answer may contain familiar words, while the correct answer requires understanding the relationship between ideas.\nGood test preparation therefore involves more than recognizing phrases.\nLearners should be able to explain why an answer is correct and why the alternatives are wrong.\nExaminations occasionally reward memory.\nThey are less impressed when the memory says only, “I'm sure I've met this sentence before.”\n重要表現\nmultiple-choice / option / familiarity / correctness / alternative / occasionally", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 210, "title": "Learning from Old Materials", "subtitle": "", "theme": "教育・学習", "level": "英検2級", "body": "An old textbook may appear outdated, especially when its photographs, examples, or expressions belong to another period.\nYet much of the language inside it may still be useful.\nOlder materials can also show how language and society have changed. Learners can compare an original expression with the way people might say the same thing today.\nInstead of throwing away every old book, we can sometimes give it a new role.\nA textbook studied twenty years ago may contain sentences that were forgotten long ago.\nMeeting them again can feel surprisingly similar to meeting old classmates.\nSome have changed. Some have not.\n重要表現\noutdated / belong to / compare / original / throw away / give A a new role", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 211, "title": "Why Stories Help Memory", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "A list of unrelated facts can be difficult to remember. A story, however, gives information relationships, sequence, characters, and context.\nThis is one reason stories have long been used to transmit knowledge.\nWhen information becomes part of a narrative, learners have more connections through which to retrieve it later.\nThis does not mean every subject should be turned into fiction. Some knowledge requires direct explanation and systematic practice.\nBut a memorable character can sometimes carry a rule farther into memory than a page of definitions.\nThe brain seems to enjoy asking not only “What happened?” but also “What happened next?”\n重要表現\nunrelated / sequence / context / transmit / narrative / systematic / definition", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 212, "title": "The Power of Retrieval", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "Rereading notes can create a strong feeling of familiarity. Because the material looks familiar, learners may believe they know it well.\nA more demanding method is to close the book and try to recall the information without looking.\nThis process, often called retrieval practice, requires the brain to reconstruct the knowledge.\nQuestions, flashcards, and practice tests can all be used for this purpose.\nLearning is not only putting information into memory.\nIt is also practicing how to get the information back out.\nA library is less useful if every book enters successfully but none can ever be found again.\n重要表現\nreread / familiarity / recall / retrieval practice / reconstruct / flashcard", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 213, "title": "Why Spacing Beats Cramming", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "Cramming can produce impressive short-term results. A student may memorize a large amount of information the night before an examination.\nThe difficulty is that much of it may disappear soon afterward.\nSpacing study across several days or weeks repeatedly brings learners back to material after some forgetting has occurred. This additional effort can strengthen long-term retention.\nCramming is sometimes effective when the only goal is surviving tomorrow morning.\nSpacing is more useful when we would still like to know the material next month.\nThe brain apparently distinguishes between “urgent delivery” and “please keep this.”\n重要表現\ncramming / short-term / afterward / spacing / retention / distinguish between", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 214, "title": "Learning Several Subjects at Once", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "People sometimes believe that they must concentrate exclusively on one subject until it is completely mastered.\nHowever, learning several subjects in parallel can have advantages when the schedule is carefully managed.\nReturning to a subject after an interval creates opportunities for review, while changing subjects can reduce mental fatigue. Different areas of knowledge may also reinforce one another.\nThe danger is trying to do too many things without enough time for any of them.\nParallel learning should resemble a well-organized orchestra, not twenty musicians practicing different songs in the same room.\n重要表現\nexclusively / master / in parallel / interval / mental fatigue / reinforce / resemble", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 215, "title": "Why Teaching Helps the Teacher", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "Explaining an idea to another person can reveal weaknesses in our own understanding.\nA concept may seem perfectly clear inside our head until someone asks, “Why?”\nTo answer, we must organize the information, identify important points, and connect them logically. Questions from others may expose assumptions we had never noticed.\nThis is why teaching can be a powerful form of learning.\nEven without another person present, learners can try explaining a topic aloud as if they were teaching someone.\nIf the imaginary student looks confused, the teacher may need another review.\n重要表現\nreveal / concept / logically / expose / assumption / imaginary", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 216, "title": "The Illusion of Fluency", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "After reading the same page several times, a learner may feel that the material has become easy.\nPart of this feeling comes from genuine learning. But part may result simply from familiarity with the page itself.\nPsychologists sometimes describe this as an illusion of fluency: information feels easier to process, so learners assume they can reproduce it independently.\nOne way to test understanding is to remove the material and explain it from memory.\nThe textbook is a very supportive friend.\nUnfortunately, it cannot sit beside us during every examination.\n重要表現\ngenuine / familiarity / illusion / fluency / assume / independently / supportive", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 217, "title": "Do Grades Measure Learning?", "subtitle": "", "theme": "教育・学習", "level": "英検2級→準1級", "body": "Grades provide a convenient way to summarize performance, but they cannot capture every aspect of learning.\nA test score may reflect knowledge, preparation, test-taking skill, time pressure, and even temporary factors such as fatigue.\nNevertheless, assessment remains useful because teachers and learners need some way to identify progress and difficulties.\nThe challenge is to treat scores as information rather than as complete definitions of ability.\nA score of 78 tells us something.\nIt does not tell us everything about the person who received it.\nNumbers are useful summaries, but human beings are rather difficult to fit into a spreadsheet cell.\n重要表現\nsummarize / capture / assessment / identify / definition / spreadsheet", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 218, "title": "Why Good Questions Matter", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Education often emphasizes finding correct answers. Yet the ability to ask productive questions is equally important.\nA good question identifies uncertainty, exposes assumptions, and opens a path toward investigation.\nExperts frequently differ from beginners not only because they know more answers but because they recognize which questions are worth asking.\nThis skill becomes increasingly important when information is easy to obtain.\nIf a machine can provide thousands of facts in seconds, human value may lie partly in deciding what we actually need to know.\nAn excellent answer to a useless question remains impressively useless.\n重要表現\nproductive / uncertainty / assumption / investigation / increasingly / obtain / lie in", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 219, "title": "What Makes an Expert?", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Expertise involves more than accumulating large quantities of information.\nExperts organize knowledge into meaningful patterns, recognize important features quickly, and understand relationships that beginners may overlook.\nThey also develop judgment through experience.\nThis explains why simply giving a novice access to the same information as an expert does not immediately produce equal performance.\nA medical textbook and an experienced doctor may contain some of the same facts.\nOnly one of them can decide which facts matter in a complicated situation.\nKnowledge is essential, but organized knowledge combined with judgment is more powerful.\n重要表現\nexpertise / accumulate / meaningful / feature / overlook / novice / judgment", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 220, "title": "The Problem with Measuring Education", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Education systems need evidence about whether students are learning. Standardized tests can provide comparable data across large populations and help identify patterns.\nHowever, what is easy to measure may gradually receive more attention than what is difficult to measure.\nCreativity, curiosity, persistence, cooperation, and intellectual independence are important educational outcomes, but they are harder to represent with a single score.\nThis creates a danger: the measurement may begin to shape the goal.\nIf schools teach only what can easily be tested, education risks becoming excellent preparation for tests rather than excellent preparation for life.\n重要表現\nstandardized / comparable / population / persistence / intellectual / outcome / shape", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 221, "title": "Should Education Be Practical?", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "People often argue that education should prepare students for employment by teaching practical skills.\nThis is clearly an important function. Yet education has historically served broader purposes as well: developing reasoning, cultural understanding, citizenship, curiosity, and the ability to continue learning independently.\nThe difficulty is that future practical needs are not always predictable.\nA highly specific skill may become outdated, while the ability to learn new skills remains valuable.\nEducation should therefore prepare people not only for the jobs that exist today but also for situations nobody has predicted yet.\nTeaching someone how to learn may be one of the most practical skills of all.\n重要表現\nemployment / function / citizenship / independently / predictable / specific / outdated", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 222, "title": "Learning in the Age of Search Engines", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "When information was difficult to obtain, memorizing facts had obvious value. Today, enormous amounts of information can be found within seconds.\nDoes this mean memory is no longer important?\nNot necessarily.\nPeople need background knowledge to judge whether new information is reasonable, connect it with other ideas, and formulate useful questions. Searching effectively also requires knowing enough to recognize a good answer.\nExternal information systems can extend human memory, but they cannot completely replace internal knowledge.\nYou can search for almost anything.\nThe difficult part is sometimes knowing what to type into the box.\n重要表現\nobtain / background knowledge / formulate / effectively / external / internal", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 223, "title": "Learning with Artificial Intelligence", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Artificial intelligence can explain concepts, generate practice questions, provide feedback, translate difficult passages, and adapt material to different levels.\nUsed well, such tools can make learning more interactive and personalized.\nHowever, convenience creates a temptation to let the system perform the intellectual work that the learner needs to practice.\nIf AI writes every answer, solves every problem, and summarizes every book, the learner may receive excellent results while developing fewer skills.\nThe most useful educational technology does not simply remove difficulty.\nIt helps learners work through the right kind of difficulty.\nA calculator is useful. Asking it to exercise your mathematical brain on your behalf is more complicated.\n重要表現\ninteractive / personalized / temptation / intellectual / summarize / work through / on one's behalf", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 224, "title": "Why Lifelong Learning Matters", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Education was once commonly imagined as a stage of life that ended when formal schooling finished.\nIn modern societies, knowledge and technology change so rapidly that adults may need to learn new skills throughout their careers and beyond.\nLifelong learning does not necessarily mean continuously collecting qualifications. It can include languages, hobbies, technology, professional knowledge, history, science, music, or any field that expands understanding.\nAdults also bring something valuable to learning that children do not yet possess: decades of experience to which new knowledge can connect.\nThe older library is not empty.\nIt simply has more shelves on which to place the new books.\n重要表現\nformal schooling / rapidly / throughout / qualification / professional / expand / possess\nWIT POINT\n年齢を重ねることを学習上の不利だけでなく、新しい知識を結びつける棚が増えることとして表現しています。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 225, "title": "What Is Learning For?", "subtitle": "", "theme": "教育・学習", "level": "英検準1級", "body": "Learning is often connected with practical goals: passing an examination, obtaining a qualification, entering a university, finding employment, or developing professional skills.\nThese goals are important. Yet learning can also change how people experience the world.\nKnowing another language can make unfamiliar sounds meaningful. Understanding history can reveal the past hidden inside modern institutions. Scientific knowledge can transform an ordinary observation into an interesting question.\nEducation therefore does more than provide answers.\nIt increases the number of things we are capable of noticing.\nA person who continues learning does not simply accumulate information. The same world gradually becomes richer because more of it becomes understandable.\nPerhaps that is one reason learning can remain enjoyable throughout an entire life.\nWe do not need to find a new world every day.\nSometimes we only need to learn how to see more in the world we already have.\n重要表現\npractical / obtain / unfamiliar / institution / transform / be capable of / accumulate / throughout\n音読POINT\nEducation therefore does more / than provide answers. / It increases the number of things / we are capable of noticing.\nWe do not need / to find a new world every day. / Sometimes we only need to learn / how to see more / in the world we already have.\nWIT / MESSAGE POINT\n第9分野の結論です。学習を「試験に合格するための知識の追加」だけでなく、同じ世界から以前より多くのものが見えるようになることとして捉えました。\n第10分野｜文化・言語・コミュニケーション", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 226, "title": "Why Do Languages Have Different Words?", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "Languages divide the world into words in different ways.\nTwo languages may have words that appear to mean the same thing but are used in slightly different situations. One language may use a single word where another language requires several.\nThis is one reason learning vocabulary is more complicated than simply replacing one word with another.\nA bilingual dictionary is extremely useful, but it cannot always explain every difference in feeling, context, and usage.\nWords are not labels attached neatly to objects by an international committee.\nIf they were, language learning would be considerably easier—and dictionaries would be much thinner.\n重要表現\ndivide / appear to / situation / replace / bilingual / context / usage\nWIT POINT\n「世界共通単語決定委員会」が最初に全部決めてくれていたら外国語学習は簡単でした。しかし、もちろんそんな委員会はありません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 227, "title": "The Word That Cannot Be Translated", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "People sometimes say that a particular word in one language is “impossible to translate.”\nUsually, this does not mean that its meaning cannot be explained. It means that another language may not have a single word with exactly the same range of meaning and cultural associations.\nA translator can often express the idea by using several words or explaining the context.\nTranslation is therefore not simply replacing vocabulary item by item.\nThe supposedly “untranslatable” word can usually travel into another language.\nIt may simply need a larger suitcase.\n重要表現\nparticular / translate / range / association / express / supposedly", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 228, "title": "Why Accents Exist", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "People who speak the same language do not necessarily pronounce it in the same way.\nAccents develop through geography, history, social contact, migration, and many other influences. They can also become important parts of local identity.\nLearners sometimes worry that having an accent means speaking badly. Yet every native speaker also has an accent of some kind.\nClear communication matters, but there is no human voice that comes from nowhere.\nThe person who says, “I don't have an accent,” usually means, “My accent sounds normal to me.”\nEveryone else's accent has the same remarkable property.\n重要表現\npronounce / geography / migration / influence / identity / native speaker / property", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 229, "title": "Dialects Are Not Bad Language", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "A dialect may differ from a standard language in pronunciation, vocabulary, and grammar.\nPeople sometimes incorrectly assume that dialect speakers are simply making mistakes. Linguists, however, study dialects as systematic varieties of language with their own patterns.\nStandard languages are useful because they make communication easier across large areas and provide common forms for education and administration.\nBut “standard” does not necessarily mean linguistically superior.\nA standard language is often a dialect that became particularly successful at obtaining government paperwork.\n重要表現\ndialect / standard / assume / linguist / systematic / administration / superior\nWIT POINT\n標準語も言語学的に「偉い言葉」なのではなく、歴史的・社会的事情で標準になったものです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 230, "title": "When Gestures Go Abroad", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "Travelers quickly discover that communication involves more than words.\nHand movements, eye contact, physical distance, and facial expressions can carry different meanings in different cultures.\nA gesture that is friendly in one place may be confusing or inappropriate somewhere else.\nThis does not mean travelers must become experts in every local custom before leaving home. Awareness and observation can prevent many misunderstandings.\nWhen words fail, people often communicate with their hands.\nUnfortunately, hands also have regional vocabulary.\n重要表現\ngesture / eye contact / facial expression / inappropriate / awareness / misunderstanding", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 231, "title": "Why Jokes Are Difficult to Translate", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "Humor is one of the most difficult parts of a language to translate.\nA joke may depend on a word having two meanings, a familiar cultural reference, a particular sound, or an unexpected change in meaning.\nA literal translation may preserve every word and lose the joke completely.\nTranslators sometimes need to create a different joke that produces a similar effect.\nThis shows an important principle: successful translation does not always mean copying the original structure exactly.\nA joke that requires a five-minute explanation has technically crossed the language barrier.\nIts sense of humor may not have survived the journey.\n重要表現\ndepend on / reference / literal / preserve / effect / original structure / language barrier", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 232, "title": "Silence Is Communication Too", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "Conversation is usually associated with speaking, but silence can also communicate.\nA pause may show hesitation, respect, disagreement, thoughtfulness, discomfort, or simply a desire not to interrupt.\nThe interpretation depends heavily on context and culture.\nIn some situations, silence feels natural. In others, even a few seconds can make people uncomfortable.\nLanguage learners often concentrate so strongly on finding the correct words that they forget communication also includes timing.\nSometimes the most intelligent sentence in a conversation is the one we decide not to say.\n重要表現\npause / hesitation / disagreement / thoughtfulness / interpretation / timing", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 233, "title": "The Danger of “Yes”", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級", "body": "A simple word such as “yes” can cause surprising confusion across cultures.\nIn some contexts, saying yes means clear agreement. In others, a similar response may mean only “I hear you,” “I understand,” or “I will consider it.”\nProblems arise when speakers interpret the response according to their own expectations.\nSuccessful communication therefore requires attention not only to words but also to how those words function in a particular social setting.\n“Yes” is one of the shortest words in English.\nUnfortunately, the explanation of what someone meant by it can occasionally be much longer.\n重要表現\nagreement / consider / arise / interpret / expectation / function / social setting", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 234, "title": "Why Politeness Is Complicated", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "Every language has ways of expressing politeness, but languages do not necessarily use the same strategies.\nSome rely heavily on special forms of address or grammatical choices. Others may express politeness through indirect requests, tone, or particular expressions.\nAs a result, a sentence translated literally from another language may sound unexpectedly formal, casual, or even rude.\nLearning politeness therefore requires more than grammar.\nLearners must understand relationships and situations.\nA grammatically perfect sentence can still enter a room wearing completely the wrong clothes.\n重要表現\npoliteness / strategy / form of address / indirect / literally / formal / casual\nWIT POINT\n文法的には100点なのに、その場に全く合わない英文ということがあります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 235, "title": "The Language of Text Messages", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "Digital communication has created new styles of writing.\nPeople shorten words, use emojis, omit punctuation, and develop expressions suited to rapid informal communication.\nCritics sometimes worry that such habits will damage formal writing. However, many people successfully use different styles in different contexts.\nThe ability to switch between an informal message and a formal document is itself a form of linguistic skill.\nNobody normally writes a legal contract in the same style as a message to a friend.\nAnd if someone does, the emoji at the end may create interesting legal questions.\n重要表現\nomit / punctuation / informal / critic / formal / switch between / linguistic", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 236, "title": "Why Languages Borrow Words", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "Languages frequently borrow vocabulary from one another.\nTrade, migration, conquest, science, technology, food, fashion, and popular culture all create opportunities for words to cross linguistic boundaries.\nBorrowed words may gradually change their pronunciation or meaning until speakers no longer think of them as foreign.\nThis process is not evidence that a language is weak. Borrowing is one of the normal ways languages develop.\nLanguages are rather like cooks.\nWhen they discover a useful ingredient elsewhere, they rarely refuse it simply because it was not grown in their own garden.\n重要表現\nborrow / conquest / opportunity / linguistic boundary / gradually / ingredient", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 237, "title": "Words Carry History", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "A familiar word may contain traces of events that happened centuries ago.\nMigration, invasion, trade, religion, government, and cultural contact can leave vocabulary behind. Linguists study these patterns to understand how languages developed and influenced one another.\nEtymology, the study of word origins and history, can therefore connect language learning with historical research.\nA word is not always just a tool for expressing a present idea.\nSometimes it is a tiny historical document that people carry in their mouths without realizing it.\n重要表現\ntrace / invasion / cultural contact / etymology / origin / historical document", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 238, "title": "Language Families", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "Languages that look very different today may have developed from a common ancestral language.\nLinguists compare systematic similarities in vocabulary, sounds, and grammar to investigate historical relationships.\nEnglish, Italian, Greek, Hindi, and many other languages, for example, belong to the Indo-European language family, although thousands of years of change have made them very different.\nA language family is not based simply on countries being near one another or sharing similar writing systems.\nLanguages have family histories too.\nUnfortunately, unlike human families, they left very few old family photographs.\n重要表現\nancestral / systematic / similarity / investigate / relationship / belong to", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 239, "title": "How Languages Change", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "People sometimes complain that younger generations are changing the language.\nThey are correct.\nThe surprising part is that older generations changed it too.\nPronunciation, vocabulary, grammar, and meaning have always changed over time. If languages never changed, modern speakers would still speak exactly as their distant ancestors did.\nStandardization and education may slow certain changes, but they cannot stop language evolution completely.\nA living language changes because people keep using it.\nA language that never changes at all may have achieved stability for an unfortunate reason: nobody speaks it anymore.\n重要表現\ngeneration / pronunciation / over time / standardization / evolution / stability", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 240, "title": "Old English Is Not Simply Old-Fashioned English", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検2級→準1級", "body": "Modern English developed through centuries of linguistic change.\nTexts written in Old English can be extremely difficult for modern English speakers to understand without special study. Vocabulary, grammar, pronunciation, and spelling were substantially different.\nLater contact with Norse and French, along with many other historical developments, helped shape the language spoken today.\nThis reminds us that languages do not move neatly from “incorrect” forms toward “correct” ones.\nThey change.\nIf an English speaker traveled far enough into the past, the first serious communication problem might occur before meeting anyone from another country.\n重要表現\nlinguistic / substantially / historical development / shape / occur", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 241, "title": "Does Language Affect Thought?", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Researchers have long debated how language and thought influence one another.\nLanguages differ in the distinctions they regularly express. This may influence what speakers notice or how quickly they categorize certain experiences.\nHowever, strong claims that language completely determines what people are capable of thinking are difficult to support.\nHumans can learn new concepts, create new expressions, and understand ideas for which their language lacks a simple word.\nLanguage may guide attention without building an absolute prison around thought.\nIt gives us paths through the landscape of ideas, but humans remain capable of leaving the path.\n重要表現\ndebate / distinction / categorize / determine / concept / absolute / landscape", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 242, "title": "Why Misunderstandings Happen", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Communication involves more than sending information from one person to another.\nSpeakers make assumptions about what listeners already know. Listeners interpret words using context, experience, tone, and expectations.\nMisunderstandings can occur even when every individual word is heard correctly.\nThis is why repeating the same sentence more loudly does not necessarily solve a communication problem.\nEffective communication sometimes requires changing the explanation rather than increasing the volume.\nHuman conversation is not a radio signal.\nTurning up the power does not always improve reception.\n重要表現\nassumption / interpret / expectation / occur / necessarily / effective / reception\nWIT POINT\n通じない英語を大声でもう一度言う――外国旅行でも起こりがちですが、音量より説明方法の問題かもしれません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 243, "title": "Humor Requires Shared Knowledge", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Humor often depends on shared expectations.\nA joke may be funny because the listener expects one ending and receives another. Satire may require knowledge of politics or society. Wordplay may depend on recognizing two meanings simultaneously.\nThis explains why highly fluent language learners can still find humor difficult.\nUnderstanding every word does not guarantee understanding why everyone else is laughing.\nHumor therefore represents a sophisticated form of cultural and linguistic competence.\nReaching the point where you understand a joke in another language is satisfying.\nReaching the point where you can make one intentionally is even better.\n重要表現\nshared expectation / satire / wordplay / simultaneously / guarantee / sophisticated / competence", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 244, "title": "Translation Is a Choice", "subtitle": "", "theme": "文化・言語・
