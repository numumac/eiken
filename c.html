 / only by how fast we can move. / It might also be measured / by how much unnecessary waiting and movement / we can avoid.\nWIT POINT\n5分早く着くために大急ぎして、浮いた5分をスマホを見ることに使う――「速さとは何か」を少し皮肉に締めています。\n第4分野｜科学・技術", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 76, "title": "Why Does the Battery Die at the Worst Time?", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "People rarely think about a battery when it is working properly. We notice it mainly when it stops working, often at the least convenient moment.\nA phone battery may die just when we need a map, or a remote control may stop working during an important television program. Of course, batteries do not actually choose bad moments.\nThe problem is that we remember inconvenient failures more clearly than ordinary ones. Technology can sometimes appear to have a sense of humor, although the humor exists mostly in the human mind.\n重要表現\nwork properly / convenient / remote control / failure / ordinary / appear to\nWIT POINT\n機械が「今だ！」と狙って故障しているわけではありません。そう感じる人間の記憶の方に秘密があります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 77, "title": "Why Phones Get Hot", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "A smartphone may become warm when it is used for games, videos, or other demanding tasks. This is not necessarily a sign that something is wrong.\nThe phone's processor performs millions of operations, and some of the electrical energy it uses is converted into heat. The harder the processor works, the more heat may be produced.\nDesigners therefore need to find ways to remove heat safely.\nA smartphone is called “smart,” but even a smart machine becomes tired-looking when we ask it to work too hard.\n重要表現\ndemanding / necessarily / processor / operation / convert A into B / produce heat", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 78, "title": "The Mystery of the Microwave Oven", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "Microwave ovens heat food by using electromagnetic waves that cause certain molecules, especially water molecules, to move more actively.\nBecause different parts of food contain different amounts of water and have different shapes, heating is not always even. This explains why one part of a meal may be extremely hot while another remains surprisingly cold.\nTurning or stirring food helps distribute the heat more evenly.\nThe microwave oven is extremely fast, but apparently it has never learned the simple rule that everyone at the dinner table should be warm at the same time.\n重要表現\nelectromagnetic wave / molecule / actively / even / distribute / apparently", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 79, "title": "Why Airplanes Can Fly", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "An airplane may weigh hundreds of tons, so it seems surprising that it can remain in the air.\nIts wings are designed so that movement through the air produces forces that help support the aircraft. Engines provide the forward motion needed to maintain this movement.\nFlight therefore depends on a combination of carefully designed wings, sufficient speed, and controlled forces.\nFor passengers, however, the greatest mystery may not be how such a heavy machine flies, but how everyone's luggage fits inside it.\n重要表現\nremain / aircraft / forward motion / maintain / combination / sufficient", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 80, "title": "The Refrigerator Door", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "A refrigerator keeps food cold by transferring heat from inside the machine to the surrounding room. It does not simply “create cold.”\nThis leads to an interesting question. Could we cool a kitchen by leaving the refrigerator door open?\nUnfortunately, no. The refrigerator would remove some heat from its interior but release even more heat into the room because its motor also produces heat.\nSo if the kitchen feels too warm, opening the refrigerator is not an effective solution. Closing the door is better for both physics and the electricity bill.\n重要表現\ntransfer / surrounding / interior / release / effective / electricity bill", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 81, "title": "Why Do We Need Passwords?", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "Passwords are intended to protect personal information, but people often find them difficult to manage. A secure password should not be easy to guess, yet it also needs to be remembered.\nThis creates a problem. Simple passwords are convenient but unsafe, while complicated passwords may be written on paper and left beside the computer.\nModern systems increasingly use password managers and other methods of identification.\nPerhaps the perfect password is one that nobody can guess but the owner can remember—which sounds simple until we actually try to create one.\n重要表現\nbe intended to / secure / guess / complicated / identification / owner", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 82, "title": "The Robot Vacuum's Great Adventure", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "A robot vacuum cleaner can move around a room, detect obstacles, and clean the floor without continuous human control.\nHowever, the machine does not understand the room in the same way a person does. A chair is not “a chair” to the robot; it is mainly an obstacle that must be avoided.\nSometimes a robot becomes trapped under furniture or repeatedly attacks the same corner.\nThis reminds us that a machine can perform a useful task without understanding it as humans do. It may clean the entire house successfully and still have no idea that it lives in a house.\n重要表現\ndetect / obstacle / continuous / avoid / become trapped / perform a task\nWIT POINT\n家中を掃除しているのに、「ここが家だ」とは知らないロボットです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 83, "title": "Why Screens Look Smooth", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "A digital screen is made up of a huge number of tiny picture elements called pixels. Each pixel can produce different colors.\nWhen viewed from a normal distance, individual pixels are so small that our eyes combine them into smooth images. If we examine the screen closely, however, the separate elements become easier to see.\nDigital images therefore depend partly on the limitations of human vision.\nThe picture looks perfectly smooth because our eyes kindly agree not to inspect every pixel.\n重要表現\nbe made up of / element / pixel / individual / examine / limitation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 84, "title": "Why GPS Sometimes Gets Confused", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "GPS allows devices to calculate their position by receiving signals from satellites. Under good conditions, the system can be remarkably accurate.\nHowever, tall buildings, mountains, tunnels, or other obstacles can block or reflect signals. As a result, a navigation app may briefly show a person on the wrong street.\nWhen this happens, people sometimes become annoyed with the phone.\nIt is worth remembering that the device is trying to determine our location by communicating with machines thousands of kilometers away in space. A mistake of one street suddenly seems a little less embarrassing.\n重要表現\ncalculate / satellite / accurate / reflect / determine / communicate with", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 85, "title": "The Science of Soap", "subtitle": "", "theme": "科学・技術", "level": "英検2級", "body": "Water alone cannot easily remove some kinds of oil and dirt because oil does not mix well with water. Soap helps solve this problem.\nSoap molecules have one part that interacts with water and another part that interacts with oil. They can surround oily material and allow it to be carried away when we rinse our hands.\nSomething as ordinary as washing our hands therefore involves interesting chemistry.\nFortunately, we do not need to explain molecular structure every time we use soap. We only need to remember to use it.\n重要表現\nremove / interact with / surround / oily / rinse / molecular structure", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 86, "title": "Why Bridges Move", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "A large bridge may appear completely solid, but engineers actually expect it to move slightly. Temperature changes cause materials to expand and contract, while wind and traffic create additional forces.\nIf a bridge were built with no ability to move, these forces could produce dangerous stress in its structure.\nEngineers therefore include joints and other features that allow controlled movement.\nIn engineering, being perfectly rigid is not always a strength. Sometimes the ability to move a little is precisely what prevents a structure from breaking.\n重要表現\nexpand / contract / additional / stress / structure / rigid / precisely", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 87, "title": "The Problem of Perfect Predictions", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Weather forecasting has improved enormously because scientists now have satellites, powerful computers, and vast amounts of atmospheric data.\nNevertheless, perfect prediction remains impossible. The atmosphere is an extremely complex system, and small differences in present conditions can influence what happens later.\nA forecast should therefore be understood as an estimate based on the best available information, not as a promise from nature.\nUnfortunately, when a picnic is ruined by unexpected rain, few people feel like discussing the mathematical limits of atmospheric prediction.\n重要表現\nforecasting / atmospheric / prediction / influence / estimate / available", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 88, "title": "Why Updates Never Seem to End", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Software updates can be annoying, especially when a device asks to restart just when someone wants to use it.\nHowever, software is rarely finished forever. Developers discover security problems, correct errors, improve performance, and adapt programs to new hardware.\nUpdating is therefore part of maintaining a modern digital system.\nThe irony is that people want technology to improve continuously but would also prefer it never to interrupt them while improving.\n重要表現\nsoftware update / developer / security / performance / adapt / irony / continuously", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 89, "title": "Machines That Recognize Speech", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Speech recognition systems convert spoken language into information that computers can process. This task is more difficult than it may appear.\nPeople speak at different speeds, use different accents, shorten words, and produce background noise. The meaning of a sound may also depend on the words around it.\nModern systems use large amounts of data to identify patterns and estimate what was most likely said.\nHumans perform much of this interpretation automatically. We usually notice how impressive this ability is only when a machine confidently hears something completely different.\n重要表現\nspeech recognition / convert / accent / background noise / identify / interpretation", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 90, "title": "The Invisible Work of Search Engines", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Typing a few words into a search engine seems simple. Behind the screen, however, an enormous amount of work is taking place.\nSearch systems examine vast numbers of web pages, organize information, interpret the user's words, and attempt to present useful results within a fraction of a second.\nThe difficulty is not merely finding information. It is deciding which information is most relevant.\nModern society has created an unusual problem: we often have too much information rather than too little.\n重要表現\nvast / interpret / attempt to / a fraction of / merely / relevant", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 91, "title": "Can a Computer Be Creative?", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Computers can now generate pictures, music, text, and designs. This has led to debate about whether machines can truly be creative.\nPart of the difficulty lies in defining creativity itself. Humans also learn from existing works, combine familiar ideas, and produce something new.\nThe question may therefore be more complicated than simply asking whether a machine “thinks like us.”\nPerhaps technology is forcing people to examine an older question: what exactly do humans mean when they call themselves creative?\n重要表現\ngenerate / debate / lie in / define / existing / combine / force A to do", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 92, "title": "When Automation Makes Us Forget", "subtitle": "", "theme": "科学・技術", "level": "英検2級→準1級", "body": "Automation can reduce the amount of routine work people need to perform. However, skills may weaken when they are rarely used.\nDrivers who depend heavily on navigation systems may become less confident at finding routes themselves. Workers who rely on automatic systems may have difficulty taking control when those systems fail.\nThis creates a paradox. The better automation becomes, the less practice humans may receive in performing the task themselves.\nTechnology can remove unnecessary effort, but designers must consider which human abilities are still important to preserve.\n重要表現\nroutine / weaken / depend heavily on / take control / paradox / preserve", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 93, "title": "Why Scientific Experiments Fail", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "People sometimes imagine science as a smooth process in which an experiment produces a clear answer. Real research is usually less tidy.\nEquipment fails, measurements contain errors, and results may not support the original hypothesis. Such outcomes can be frustrating, but they are not necessarily useless.\nAn unexpected result may reveal a weakness in an assumption or lead researchers toward a better question.\nScience advances not because scientists are always correct, but because its methods allow ideas to be tested, criticized, and revised.\n重要表現\nmeasurement / hypothesis / outcome / reveal / assumption / revise\nWIT POINT\n実験が「失敗」したとき、科学者だけでなく仮説の方が間違っていた可能性があります。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 94, "title": "The Difference between Correlation and Cause", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "When two things occur together, people naturally try to find a connection between them. However, correlation does not necessarily prove that one thing causes the other.\nFor example, ice cream sales and cases of sunburn may both increase during summer. Buying ice cream does not cause sunburn; hot sunny weather influences both.\nConfusing correlation with causation can lead to poor conclusions in science, medicine, and public policy.\nThe human mind loves a simple story of cause and effect. Unfortunately, reality does not always cooperate by being simple.\n重要表現\ncorrelation / necessarily / causation / influence / conclusion / cause and effect", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 95, "title": "Artificial Intelligence and Confidence", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "One difficulty with artificial intelligence is that a system may produce an answer that sounds confident even when the answer is incorrect.\nHumans can make the same mistake. We often judge information partly by how fluently and confidently it is presented.\nFor this reason, users should evaluate important claims rather than accepting them merely because they are expressed clearly. Sources, evidence, and logical consistency still matter.\nIntelligence, whether human or artificial, should not be confused with the ability to sound certain.\n重要表現\nartificial intelligence / evaluate / claim / merely / evidence / consistency\n音読POINT\nIntelligence, / whether human or artificial, / should not be confused / with the ability to sound certain.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 96, "title": "Robots and Human Work", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "Whenever new machines are introduced, people worry that technology will eliminate jobs. Such concerns are reasonable because automation can certainly replace particular tasks.\nHistory, however, shows that technology can also create new occupations and change the skills that existing jobs require. The difficult part is that the new opportunities may not appear in the same places or require the same abilities as the jobs that disappear.\nThe debate should therefore focus not only on how many jobs technology creates or removes, but also on how societies help people adapt to economic change.\n重要表現\neliminate / concern / occupation / opportunity / debate / adapt to", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 97, "title": "Space Exploration and Everyday Life", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "Space exploration may seem remote from ordinary life. Sending instruments beyond Earth is expensive, and the immediate practical benefits are not always obvious.\nYet research for space missions has contributed to advances in materials, communications, sensors, and scientific knowledge. Satellites also support weather forecasting, navigation, agriculture, and disaster monitoring.\nNot every space project produces a useful household product, nor should that be its only justification. Exploration also expands knowledge.\nHuman beings have always looked beyond the next hill. Space simply happens to be a considerably larger hill.\n重要表現\nremote / immediate / contribute to / advance / monitoring / justification / expand", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 98, "title": "Why Simple Technology Can Be Better", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "Technological progress is often associated with adding more features. A new device may contain more sensors, more software, and more ways to connect with other systems.\nYet additional complexity can create new points of failure. A simple tool may be easier to repair, cheaper to maintain, and more reliable under difficult conditions.\nThe best technology is therefore not always the most advanced technology available. It is the technology most appropriate for the problem.\nA hammer without Wi-Fi remains remarkably effective at being a hammer.\n重要表現\nbe associated with / additional / complexity / point of failure / reliable / appropriate\nWIT POINT\n「Wi-Fi対応ハンマー」は必要ありません。高度な機能と良い道具は同義ではない、という話です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 99, "title": "The Limits of Measurement", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "Modern science depends heavily on measurement. Numbers allow researchers to compare results, identify patterns, and test hypotheses objectively.\nHowever, not everything that matters is easy to measure. Satisfaction, trust, creativity, and quality of life cannot always be represented adequately by a single number.\nThere is also a danger that people begin to value what can be measured simply because it is measurable, while ignoring important factors that are harder to quantify.\nNumbers are powerful tools, but a precise number can still answer the wrong question.\n重要表現\nobjectively / adequately / represent / factor / quantify / precise", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 100, "title": "Technology That Disappears", "subtitle": "", "theme": "科学・技術", "level": "英検準1級", "body": "The most impressive technology is not always the technology that attracts the most attention. In many cases, successful technology gradually becomes almost invisible.\nPeople rarely admire the engineering of a light switch each time a room becomes bright. They do not celebrate the water system whenever they turn on a tap. These technologies work so reliably that users can concentrate on their own activities instead.\nPerhaps this is one sign of mature technology: it performs a complicated task while making the task feel simple.\nThe highest compliment we sometimes give technology is to stop noticing it.\n重要表現\nimpressive / attract attention / gradually / invisible / reliably / mature / compliment\n音読POINT\nPerhaps this is one sign of mature technology: / it performs a complicated task / while making the task feel simple.\nWIT POINT\n最高の技術が「誰にも気づいてもらえない」という、少し皮肉な結論です。\n第5分野｜環境・自然", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 101, "title": "Why Leaves Change Color", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "During spring and summer, many leaves look green because they contain a substance called chlorophyll. It helps plants use sunlight to produce energy.\nAs autumn approaches and the days become shorter, some trees stop producing as much chlorophyll. The green color gradually disappears, allowing yellow and orange colors that were already present in the leaves to become visible.\nRed colors may also be produced through other chemical processes.\nPeople often travel long distances to admire autumn leaves. The trees, of course, are not performing for tourists. They are simply preparing for winter.\n重要表現\ncontain / substance / approach / gradually / visible / chemical process / prepare for\nWIT POINT\n紅葉は観光客のためのショーではありません。木にとっては冬支度です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 102, "title": "The Very Loud Cicada", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "On a hot summer morning, a single cicada can produce a surprisingly loud sound. When hundreds of them begin calling at the same time, it may seem as if the entire neighborhood has become a concert hall.\nMale cicadas make these sounds mainly to attract females. Their bodies contain special structures that allow them to produce and strengthen the sound efficiently.\nFor humans trying to sleep late on a summer morning, this biological achievement may be difficult to appreciate.\nThe cicada, however, has waited underground for a long time. Apparently, it has no intention of speaking quietly when its turn finally comes.\n重要表現\nsurprisingly / at the same time / attract / structure / efficiently / achievement / intention\nWIT POINT\n長く地中で待ったセミに「もう少し静かに」と頼んでも、聞いてくれそうにありません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 103, "title": "Why Birds Sing in the Morning", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Birdsong is especially noticeable in the early morning. Many birds use songs to communicate, defend their territory, and attract partners.\nMorning conditions can be favorable because the air is often calm and there is less human noise. Birds may therefore be heard over greater distances.\nTo a person, the dawn chorus can sound peaceful and beautiful. To the birds themselves, however, some of those lovely songs are serious messages such as, “This area is mine. Please stay away.”\nNature's music is not always as peaceful as the audience imagines.\n重要表現\nnoticeable / defend / territory / favorable / distance / dawn / audience", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 104, "title": "The Intelligence of Crows", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Crows are sometimes disliked because they open garbage bags or make loud calls. Yet they are remarkably intelligent birds.\nStudies have shown that some crows can solve problems, remember human faces, and use simple tools. They can also learn from one another.\nTheir intelligence sometimes brings them into conflict with humans because a clever bird is often very good at discovering food that humans intended to keep away from it.\nPerhaps the problem is not that crows fail to understand our cities. They may understand certain parts of them rather too well.\n重要表現\nremarkably / solve problems / tool / conflict / intend to / rather too well", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 105, "title": "A Weed Is a Plant in the Wrong Place", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Gardeners spend a great deal of time removing weeds. But what exactly is a weed?\nIn many cases, a weed is simply a plant growing where a person does not want it. The same species might be appreciated as a wildflower in another location.\nSome weeds also provide food for insects or protect the soil from erosion. This does not mean gardeners must welcome every unwanted plant.\nIt does remind us, however, that words such as “useful” and “useless” often depend on human purposes.\nA weed may simply be a plant with the wrong address.\n重要表現\nremove / species / appreciate / erosion / unwanted / depend on / purpose\nWIT POINT\n雑草とは「住所を間違えた植物」なのかもしれません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 106, "title": "Why Cats Look for Sunny Places", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Cats often choose warm, sunny places for sleeping. This behavior is partly related to body temperature and energy use.\nLike other mammals, cats need energy to maintain their body temperature. Resting in a warm location can reduce the amount of energy needed to stay comfortable.\nA patch of sunlight on the floor may therefore be an excellent resting place from a cat's point of view.\nHumans may buy an expensive bed for a cat, only to discover that the animal prefers a piece of cardboard in the sun.\nNature does not always respect the price tag.\n重要表現\nbe related to / mammal / maintain / reduce / from one's point of view / prefer", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 107, "title": "Ants and Traffic Jams", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Ants often travel along narrow paths in large numbers. Surprisingly, their traffic can remain efficient even when the path becomes crowded.\nAnts communicate partly through chemical signals and respond to the movements of nearby ants. Their behavior can help the group maintain a steady flow.\nHuman traffic is obviously more complicated, but researchers sometimes study insect behavior for ideas about transportation and networks.\nMillions of years of evolution have given ants considerable experience in commuting. They also have one advantage over humans: none of them is trying to park a large car.\n重要表現\nnarrow / efficient / chemical signal / steady / flow / evolution / considerable", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 108, "title": "Why Rain Smells Different", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "Many people notice a distinctive smell when rain begins after a long dry period.\nPart of this smell comes from substances produced by plants and microorganisms in the soil. When raindrops strike the ground, tiny particles containing these substances can enter the air.\nThe familiar smell is sometimes called petrichor.\nHumans have probably experienced it for thousands of years, long before anyone gave it a scientific name.\nScience often does not create a phenomenon. It simply gives us a more precise way to talk about something our noses already knew.\n重要表現\ndistinctive / microorganism / soil / particle / phenomenon / precise", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 109, "title": "Why Snow Makes the World Quiet", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "After heavy snow, a familiar neighborhood can suddenly seem unusually quiet. This is not only because fewer cars and people may be outside.\nFresh snow contains many small spaces filled with air. These spaces can absorb some sound instead of reflecting it strongly from hard surfaces.\nAs snow becomes older and harder, this effect may decrease.\nFor a short time, therefore, snow can change not only the appearance of a place but also its sound.\nUnfortunately, the quiet usually ends when someone starts removing the snow with a machine.\n重要表現\nunusually / contain / absorb / reflect / surface / decrease / appearance", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 110, "title": "The Useful Spider", "subtitle": "", "theme": "環境・自然", "level": "英検2級", "body": "A spider in the corner of a room may not receive a warm welcome. Many people immediately want to remove it.\nYet spiders eat flies, mosquitoes, and other small creatures that humans may dislike even more. In this sense, a spider can provide a free pest-control service.\nOf course, people should be cautious around species that may be dangerous, depending on where they live.\nBut an ordinary harmless spider may be doing useful work while asking for very little in return—except permission to build an untidy web in the corner.\n重要表現\nreceive a welcome / creature / in this sense / pest control / cautious / harmless / in return", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 111, "title": "Trees Talk—But Not Like Us", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Plants do not talk in the human sense, but they can exchange information through chemical signals.\nWhen certain plants are attacked by insects, they may release chemicals into the air. Nearby plants can respond by increasing their own chemical defenses. Plants can also interact indirectly through fungi and other organisms in the soil.\nScientists continue to investigate how complex these systems are.\nCalling this communication does not mean that trees are secretly discussing the weather. Nevertheless, forests contain far more biological interaction than a silent group of plants might suggest.\n重要表現\nexchange / release / defense / indirectly / fungi / investigate / interaction", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 112, "title": "Why Some Animals Play", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Young mammals are often observed running, chasing one another, and playing with objects even when there is no obvious practical purpose.\nPlay may help animals develop physical skills, learn social behavior, and practice responding to unexpected situations. It may also strengthen relationships within a group.\nScientists still debate exactly why play evolved and what functions it serves in different species.\nFrom an evolutionary perspective, spending energy on an apparently unnecessary activity must provide some benefit.\nChildren have suspected this for years. Adults sometimes need scientific research to be convinced.\n重要表現\nobvious / practical / strengthen / debate / evolve / perspective / apparently", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 113, "title": "The Secret Life of Soil", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Soil may appear to be little more than dirt, but healthy soil contains an extraordinary community of living organisms.\nBacteria, fungi, insects, worms, and many other organisms break down organic material and help nutrients circulate through ecosystems. Their activities influence plant growth and even the ability of soil to store water.\nBecause much of this activity occurs underground, it is easy to overlook.\nPeople admire forests for their trees and gardens for their flowers, while an enormous workforce beneath their feet receives almost no applause.\n重要表現\nextraordinary / organism / break down / nutrient / circulate / overlook / beneath\nWIT POINT\n土の中では大勢が働いていますが、ミミズに拍手をする人はあまりいません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 114, "title": "Why Moths Fly toward Lights", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Anyone who has watched insects circle an outdoor light may wonder why they behave this way.\nFor many years, one explanation was that insects used distant natural light, such as the moon, for navigation and became confused by nearby artificial lights. Researchers continue to investigate the exact mechanisms, and newer studies have suggested more complex explanations involving how insects orient their bodies to light.\nWhatever the mechanism, artificial lighting can seriously disturb some insects.\nFrom the moth's perspective, our convenient lamp may be an extremely confusing addition to the night sky.\n重要表現\nnavigation / artificial / mechanism / orient / disturb / perspective", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 115, "title": "The Ocean Is Not Empty", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Looking across the ocean from the shore, we may see an enormous area of apparently empty water. Beneath the surface, however, exists a complex world of organisms, currents, temperature differences, and chemical processes.\nEven tiny plankton can play major roles in marine food webs and global cycles.\nThis is one reason changes in ocean conditions can have effects far beyond a single species.\nThe ocean often looks simple because most of its activity is hidden from human eyes. A calm blue surface can be one of nature's most effective ways of hiding an extremely busy system.\n重要表現\nbeneath / current / plankton / marine / food web / global cycle / condition", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 116, "title": "Why Beaches Move", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "A beach may look permanent, but sand is constantly being moved by waves, wind, tides, and currents.\nDuring some seasons, waves remove sand from the shore; during others, sand may return. Storms can produce dramatic changes in a very short time.\nHuman structures such as walls and harbors can also affect how sediment moves along a coastline.\nFor this reason, protecting one section of coast can sometimes create unexpected effects somewhere else.\nA beach is not simply a pile of sand beside the sea. It is part of a moving system.\n重要表現\npermanent / constantly / tide / dramatic / sediment / coastline / unexpected effect", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 117, "title": "The Problem with Feeding Wild Animals", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Giving food to a wild animal can feel like an act of kindness. Unfortunately, the long-term effects may be harmful.\nAnimals that regularly receive food from humans can lose their natural fear of people and become dependent on an artificial food source. Large numbers may gather in places where they would not normally remain.\nHuman food may also be unsuitable for their nutritional needs.\nThe animal that looks grateful today may return tomorrow with ten relatives.\nKindness toward wildlife therefore requires understanding its natural behavior rather than simply offering food.\n重要表現\nlong-term / harmful / dependent on / artificial / nutritional / wildlife / rather than\nWIT POINT\n一羽に餌をあげたつもりが、翌日は親戚一同が来るかもしれません。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 118, "title": "Cities as Ecosystems", "subtitle": "", "theme": "環境・自然", "level": "英検2級→準1級", "body": "Cities are often described as the opposite of nature, yet they contain their own ecosystems.\nBirds nest on buildings, insects live in parks, plants grow in cracks, and mammals learn to find food in human environments. Some species struggle in cities, while others adapt remarkably well.\nUrban ecology examines these relationships and can help planners create spaces that support both people and wildlife.\nNature does not stop at the city boundary. In fact, it frequently enters without asking permission and grows between two pieces of concrete.\n重要表現\nopposite / ecosystem / crack / adapt / urban ecology / boundary / frequently", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 119, "title": "Why Biodiversity Matters", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Biodiversity refers to the variety of living organisms, genes, and ecosystems found in a particular area or across the planet.\nIts importance is not limited to preserving rare and attractive animals. Diverse ecosystems can support pollination, soil formation, water purification, and other processes on which human societies depend.\nThe loss of one species may appear insignificant, but relationships within ecosystems can be complex and difficult to predict.\nNature is not a machine in which every part has a clearly printed label explaining what will happen if it is removed.\n重要表現\nbiodiversity / variety / preserve / pollination / purification / insignificant / predict", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 120, "title": "Climate and Weather Are Not the Same", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Weather describes short-term atmospheric conditions, while climate refers to patterns observed over much longer periods.\nA particularly cold day therefore does not by itself disprove long-term warming, just as one unusually hot day does not by itself prove it.\nScientists examine large amounts of data collected across regions and decades to identify climate trends.\nConfusing weather with climate is similar to judging a student's entire academic ability from one quiz. The quiz matters, but it is only one piece of a much larger record.\n重要表現\nshort-term / atmospheric / refer to / disprove / collect / trend / academic ability", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 121, "title": "When Protecting Nature Changes Nature", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Environmental protection sometimes requires active human intervention. Invasive species may need to be controlled, damaged habitats restored, or fires deliberately managed.\nThis can create a difficult question: if people intervene to protect an ecosystem, is the resulting environment still “natural”?\nIn many places, humans have influenced landscapes for centuries or even thousands of years. Completely removing human influence may therefore be impossible.\nConservation is often less about returning nature to a perfect past and more about deciding which ecological conditions society wants to maintain for the future.\n重要表現\nintervention / invasive species / habitat / deliberately / landscape / conservation / ecological", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 122, "title": "The Tragedy of Plastic Convenience", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Plastic became popular partly because it is light, durable, inexpensive, and easy to shape. These qualities made it extraordinarily useful for packaging, medicine, transportation, and countless other purposes.\nUnfortunately, the same durability that makes plastic useful can become a problem after the product is discarded. Material designed to last may remain in the environment long after its brief period of use has ended.\nThe issue illustrates a broader environmental principle: a useful property during a product's life can become a disadvantage after disposal.\nA plastic fork may be used for ten minutes and remain for decades. That is an impressive career for a very unsuccessful fork.\n重要表現\ndurable / countless / discard / property / disadvantage / disposal\nWIT POINT\n10分働いて何十年も残るフォーク。耐久性が「長所から短所へ」変わる例です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 123, "title": "Can Technology Solve Environmental Problems?", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Technological innovation can reduce environmental damage. Renewable energy, efficient transportation, improved batteries, and better recycling systems all have important roles to play.\nHowever, technology alone may not solve problems created by continuously increasing consumption. A more efficient device can still increase total resource use if people simply buy and use more devices.\nThis effect reminds us that environmental problems involve both technology and human behavior.\nInnovation can give society better tools, but tools cannot decide how much is enough.\nThat remains a surprisingly human problem.\n重要表現\ninnovation / renewable / consumption / efficient / resource / involve / remain", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 124, "title": "What Is Nature Worth?", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Economists sometimes attempt to estimate the monetary value of forests, wetlands, and other ecosystems by calculating the services they provide.\nA wetland, for example, may reduce flooding, improve water quality, store carbon, and provide habitat for wildlife. Expressing these benefits in financial terms can help policymakers compare different choices.\nYet some people argue that nature has values that cannot be fully expressed in money.\nA forest may be economically useful, culturally meaningful, scientifically important, and beautiful at the same time.\nPutting a price on nature can reveal its hidden economic value, but it should not persuade us that price and value are identical.\n重要表現\nestimate / monetary / wetland / calculate / financial terms / policymaker / identical", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 125, "title": "Humans Are Part of Nature", "subtitle": "", "theme": "環境・自然", "level": "英検準1級", "body": "Environmental discussions often describe humans and nature as if they were two separate forces: people damage nature, protect nature, visit nature, or return to nature.\nBiologically, however, humans are themselves part of the natural world. Our cities, technologies, and economies may be unusual, but they are activities performed by a species that evolved on this planet.\nRecognizing this does not excuse environmental destruction. Instead, it emphasizes that environmental problems are not conflicts between humanity and some completely separate world.\nThey concern the conditions under which our own species and countless others can continue to live.\nPerhaps the most useful question is not how humans can leave nature alone, but how humans can learn to live as responsible participants within it.\nAfter all, there is nowhere outside nature for us to move to.\n重要表現\nseparate / biologically / evolve / excuse / destruction / emphasize / participant\n音読POINT\nPerhaps the most useful question is not / how humans can leave nature alone, / but how humans can learn to live / as responsible participants within it.\nWIT POINT\n「自然を守る人間」と考えがちですが、人間自身も自然の一員。最後の there is nowhere outside nature for us to move to が全体を締めます。\n第6分野｜歴史・文明", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 126, "title": "Why Humans Started Writing", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "Writing is so common today that it is difficult to imagine society without it. Yet for most of human history, people lived without written language.\nSome of the earliest writing systems developed partly because growing societies needed to record practical information. Officials and merchants had to keep track of goods, taxes, land, and payments.\nWriting later became a way to preserve stories, laws, religious ideas, and scientific knowledge.\nIt is amusing to think that one of humanity's greatest intellectual inventions may have been encouraged by a very ordinary problem: somebody needed to remember who owed what to whom.\n重要表現\nwriting system / practical / keep track of / merchant / preserve / intellectual / owe\nWIT POINT\n文字の歴史の出発点の一つが「哲学を書き残したい」ではなく、帳簿だったというのが面白いところです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 127, "title": "The Ancient Complaint Letter", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "People sometimes imagine ancient history as a world of kings, wars, and temples. However, ordinary people also had ordinary problems.\nAn ancient clay tablet discovered in Mesopotamia contains what is often described as a customer complaint. A man complained that a merchant had supplied copper of poor quality and had treated his messenger badly.\nThousands of years later, the situation sounds strangely familiar.\nTechnology has changed from clay tablets to online reviews, but dissatisfied customers have apparently been expressing themselves for a very long time.\nHuman civilization may advance, but the sentence “I would like to speak to the manager” has deep historical roots.\n重要表現\nclay tablet / complaint / merchant / supply / poor quality / dissatisfied / historical roots\nWIT POINT\n古代メソポタミアにも「商品が悪い！」という顧客がいました。媒体が粘土板だっただけです。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 128, "title": "A World before Clocks", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "Modern people organize their lives by hours and minutes. Meetings begin at 9:00, trains leave at 10:17, and phones display the exact time throughout the day.\nIn earlier societies, daily time was often understood more closely through natural events such as sunrise, sunset, and the position of the sun.\nMechanical clocks gradually allowed communities to divide time more precisely.\nGreater precision brought obvious advantages, but it also created new possibilities for being late.\nBefore accurate clocks, arriving at “about noon” probably offered considerably more flexibility than arriving at 12:03.\n重要表現\norganize / throughout / position / mechanical / precisely / accuracy / flexibility", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 129, "title": "Why Calendars Are Complicated", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "A calendar seems simple until people try to design one.\nA day is based on Earth's rotation, a year on Earth's movement around the sun, and a month was historically connected with the moon. Unfortunately, these natural cycles do not divide neatly into one another.\nSocieties therefore developed different systems for organizing days, months, and years. Adjustments such as leap years help calendars remain connected with the seasons.\nThe calendar hanging on a wall looks perfectly orderly.\nThe universe, however, did not arrange its movements for the convenience of office workers.\n重要表現\nrotation / historically / cycle / neatly / adjustment / leap year / orderly", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 130, "title": "The Invention of Money", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "Before coins and modern currencies became common, people exchanged many kinds of valuable goods. However, direct exchange can be inconvenient.\nSuppose a farmer has grain and wants shoes. The shoemaker must not only have shoes available but also want grain at that particular moment.\nMoney helps solve this problem by providing a commonly accepted way to measure and exchange value.\nOver time, money has taken many forms, from metal coins and paper notes to digital records.\nIts physical form may change, but its success still depends greatly on a remarkably abstract idea: people agree that it has value.\n重要表現\ncurrency / direct exchange / particular / commonly accepted / take many forms / abstract", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 131, "title": "Ancient Roads", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "Roads played an important role in the growth of ancient states and empires. They allowed armies, officials, merchants, and messages to move more efficiently across large territories.\nWell-designed roads could strengthen political control while also encouraging trade and cultural exchange.\nSome ancient routes continued to influence transportation long after the governments that built them disappeared.\nA road therefore has a longer memory than we might expect.\nRulers may build roads to control an empire, only for tourists two thousand years later to walk along them while eating ice cream.\n重要表現\nempire / territory / strengthen / political control / route / influence", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 132, "title": "How Messages Traveled before Email", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "For most of history, sending a message over a long distance required moving a physical object from one place to another.\nMessengers traveled on foot, horseback, or by ship. Some states created relay systems in which fresh horses or new messengers carried information along established routes.\nEven an urgent message could require days or weeks to arrive.\nToday, people sometimes become impatient when an electronic message takes several seconds to appear.\nHuman expectations have clearly traveled faster than human patience.\n重要表現\nphysical / messenger / on foot / relay system / established / urgent / impatient", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 133, "title": "The Ancient City", "subtitle": "", "theme": "歴史・文明", "level": "英検2級", "body": "Ancient cities were centers of government, religion, trade, and craft production. They brought large numbers of people together and created opportunities that small villages could not provide.\nThey also created familiar urban problems. Cities needed water supplies, waste management, roads, markets, security, and rules for crowded spaces.\nAlthough modern technology has changed the scale of these challenges, the basic questions are surprisingly old.\nHow do we provide water? Where does the waste go? Why is that neighbor making so much noise?\nCivilization has spent thousands of years working on these questions.\n重要表現\ncraft / opportunity / water supply / waste management / scale / challenge", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 134, "title": "Why Ancient People Traded Far Away", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Long-distance trade existed thousands of years before modern transportation. Merchants carried metals, spices, textiles, precious stones, and other goods across difficult routes.\nWhy take such risks when local products were available?\nOne reason was that certain resources existed only in particular regions. Another was that rare foreign goods could become symbols of wealth or social status.\nTrade also carried ideas, technologies, languages, and religious beliefs.\nA merchant might set out hoping to sell cloth and unintentionally help spread a new idea across a continent.\n重要表現\nlong-distance / textile / precious / resource / social status / unintentionally", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 135, "title": "Sailing without GPS", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "For most of maritime history, sailors crossed seas without satellites or electronic navigation.\nThey observed coastlines, stars, winds, currents, and the position of the sun. Experienced sailors also accumulated knowledge about seasonal conditions and local waters.\nNavigation required both instruments and careful observation.\nModern GPS has made finding a position dramatically easier, but it can hide the complexity of the task.\nA sailor once needed knowledge of the sky and sea. Today, a driver can become lost because the phone battery is at one percent.\nProgress has its own forms of danger.\n重要表現\nmaritime / coastline / current / accumulate / navigation / instrument / complexity", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 136, "title": "The Silk Roads", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "The Silk Roads were not a single road running directly between China and Europe. They were networks of routes connecting many regions across Asia and beyond.\nGoods often passed through numerous merchants rather than traveling from one end of the network to the other with the same person.\nAlong with silk, spices, metals, and other products, ideas and religions also moved through these connections.\nThe history of the Silk Roads shows that globalization did not begin with airplanes or the internet.\nAncient merchants had already discovered that the world becomes surprisingly connected when somebody somewhere wants what somebody else has.\n重要表現\nnetwork / numerous / rather than / connection / globalization / merchant", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 137, "title": "Paper Changes the World", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Writing is useful only when there is something suitable to write on. Different societies used materials such as stone, clay, wood, papyrus, parchment, and eventually paper.\nPaper had major advantages because it could be relatively light, flexible, and inexpensive to produce.\nAs paper-making techniques spread, written information became easier to store and transport.\nA sheet of paper looks technologically simple today, but inexpensive writing material helped transform administration, education, literature, and communication.\nSometimes a civilization-changing technology does not need a battery.\n重要表現\nsuitable / papyrus / parchment / relatively / technique / administration / transform", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 138, "title": "The Printing Revolution", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Before printing became widespread, books had to be copied by hand or produced through other labor-intensive methods. This made them expensive and limited their availability.\nPrinting technology allowed large numbers of similar copies to be produced more efficiently.\nAs books became more accessible, ideas could circulate among larger groups of people. Education, religion, science, and politics were all affected.\nPrinting did not automatically make every printed statement true.\nIt simply allowed both excellent ideas and terrible ideas to travel much faster.\nIn that respect, the information age may be older than we think.\n重要表現\nwidespread / labor-intensive / availability / accessible / circulate / automatically / in that respect", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 139, "title": "Libraries: Humanity's External Memory", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Human memory is powerful but limited. Societies therefore developed ways to preserve knowledge outside individual minds.\nLibraries collect and organize written material so that information can survive beyond the lifetime of its original author or reader.\nThis allows later generations to build on earlier knowledge rather than beginning again from nothing.\nModern digital storage has greatly expanded this ability, but the basic purpose remains similar.\nA library is, in a sense, civilization admitting, “There is far too much to remember. We had better write some of this down.”\n重要表現\npreserve / individual / lifetime / generation / build on / storage / in a sense", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 140, "title": "When Books Were Treasure", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Today, books can be produced cheaply, and millions of texts are available online. In earlier periods, however, a single book could require enormous amounts of skilled labor.\nMaterials had to be prepared, texts copied, and illustrations sometimes added by hand. Books could therefore represent considerable wealth.\nThis historical background helps explain why libraries and religious institutions protected manuscripts so carefully.\nModern readers may complain when a book costs too much.\nA medieval reader might have been impressed simply by the idea that an ordinary person could own an entire shelf of them.\n重要表現\nskilled labor / illustration / represent / considerable / institution / manuscript", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 141, "title": "Languages Leave Footprints", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Languages change whenever groups of people interact. Trade, migration, conquest, religion, and cultural exchange can all introduce new words and expressions.\nEnglish, for example, contains vocabulary from many linguistic sources. Other languages show similar layers of historical contact.\nWords can therefore function like small historical records. A borrowed word may preserve evidence of an encounter that happened centuries ago.\nWhen we study vocabulary, we are not merely memorizing labels.\nSometimes we are examining the footprints left behind when one civilization met another.\n重要表現\nmigration / conquest / linguistic / layer / borrowed word / encounter / leave behind", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 142, "title": "Why Place Names Survive", "subtitle": "", "theme": "歴史・文明", "level": "英検2級→準1級", "body": "Governments change, populations move, and languages evolve, yet place names can survive for surprisingly long periods.\nA name may preserve an older language that is no longer widely spoken in the region. It may refer to a geographical feature, a historical person, an occupation, or an event whose original meaning has been forgotten.\nFor historians and linguists, place names can therefore provide valuable clues about the past.\nMillions of people may use an ancient name every day without realizing that they are repeating a tiny piece of history whenever they say where they live.\n重要表現\npopulation / evolve / geographical feature / occupation / linguist / clue", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 143, "title": "The Problem with Ancient Maps", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "Old maps are valuable historical sources, but they should not always be judged by modern standards of geographical accuracy.\nSome maps were designed for navigation, while others emphasized political, religious, or symbolic information. The size or position of a place might reflect its importance rather than its exact physical location.\nTo understand an old map, historians therefore ask what purpose it served and who created it.\nA map is not simply a picture of the world. It is also a picture of how someone understood the world.\nModern maps are more accurate, although anyone who has followed a navigation app into the wrong parking lot knows that perfection remains distant.\n重要表現\nhistorical source / geographical / emphasize / symbolic / reflect / serve a purpose", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 144, "title": "The History Written in Rubbish", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "Historians and archaeologists naturally value beautiful objects, official documents, and impressive buildings. Yet ordinary rubbish can sometimes provide equally useful evidence.\nBroken pottery, animal bones, food remains, and discarded tools reveal what people ate, produced, used, and threw away.\nUnlike official monuments, rubbish was rarely created to impress future generations. It can therefore offer evidence of everyday life that formal records overlook.\nOne civilization's garbage can become another civilization's research material.\nThis raises an uncomfortable thought: future archaeologists may learn a great deal about us from the things we hoped nobody would notice.\n重要表現\narchaeologist / pottery / discard / monument / evidence / overlook\nWIT POINT\n未来の考古学者が現代文明をゴミから研究する可能性があります。私たちも古代人に同じことをしています。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 145, "title": "History Is Not a Recording", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "The past happened only once, but historians can interpret it in different ways.\nHistorical evidence is incomplete. Some documents survive while others disappear, and many people in the past left no written records at all. Sources may also reflect the interests or prejudices of those who created them.\nHistorians therefore compare evidence, question reliability, and construct explanations based on what remains.\nStudying history is not like watching a complete video of the past.\nIt is more like reconstructing a long film after discovering that most of the scenes are missing and several of the surviving characters disagree about what happened.\n重要表現\ninterpret / incomplete / prejudice / reliability / construct / reconstruct", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 146, "title": "Why Empires Fall", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "People often search for a single reason why a powerful empire declined. They may blame invasion, economic weakness, political conflict, disease, environmental change, or ineffective leadership.\nIn reality, major historical changes usually involve several interacting causes. A problem that would be manageable under normal conditions may become serious when combined with other pressures.\nThis complexity makes history difficult but also interesting.\nEmpires rarely receive a convenient notice saying, “Your civilization will end next Tuesday for the following three reasons.”\nHistorical decline is usually much less organized.\n重要表現\ndecline / invasion / ineffective / interacting / manageable / pressure / complexity", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 147, "title": "Civilizations Borrow from One Another", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "Popular accounts of history sometimes describe civilizations as separate units that independently produced their own achievements.\nReality is usually more interconnected. Mathematical ideas, crops, technologies, artistic styles, religious beliefs, and scientific knowledge have repeatedly crossed political and cultural boundaries.\nBorrowing does not mean that societies simply copy one another. Imported ideas are often modified and combined with local traditions.\nHuman civilization can therefore be understood partly as a long conversation among societies.\nLike most long conversations, nobody remembers exactly who introduced every idea first.\n重要表現\nachievement / interconnected / boundary / modify / local tradition / be understood as", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 148, "title": "When New Technology Frightens People", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "New technologies often create anxiety. Printing, railways, telephones, radio, television, computers, and the internet all produced concerns about how they might change society.\nSome fears proved exaggerated, while others identified genuine problems. Technologies can create benefits and risks at the same time.\nHistorical perspective is useful because it reminds us that technological anxiety is not new.\nHowever, history should not be used to dismiss every modern concern. The fact that people worried unnecessarily in the past does not prove that every new technology is harmless.\nOur ancestors worried about technology too. Sometimes they were wrong. Unfortunately, that does not tell us whether we are wrong today.\n重要表現\nanxiety / concern / exaggerated / genuine / perspective / dismiss / harmless", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 149, "title": "Who Gets Remembered?", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "Traditional histories often focused on rulers, generals, political leaders, and other powerful individuals because these people left abundant written records.\nModern historians have increasingly tried to understand the experiences of ordinary workers, women, children, minority communities, and others whose lives were less frequently documented.\nThis requires creative use of evidence such as letters, household objects, legal records, oral traditions, and archaeological remains.\nHistory changes not because the past itself changes, but because new questions are asked of the surviving evidence.\nThe famous have always been good at leaving records. The challenge is hearing the people who did not have someone writing down everything they said.\n重要表現\nabundant / increasingly / document / oral tradition / archaeological / surviving evidence", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 150, "title": "Why Study History?", "subtitle": "", "theme": "歴史・文明", "level": "英検準1級", "body": "History cannot provide a simple instruction manual for the future. No two situations are exactly alike, and people who claim that “history proves” a particular decision is correct often simplify the past too much.\nWhat history can provide is a wider range of human experience.\nIt shows how institutions developed, how societies responded to crises, how ideas changed, and how decisions produced consequences that people did not always anticipate.\nHistory also challenges the assumption that the way we live now is natural or inevitable. Other societies organized life differently, and future societies will probably do so as well.\nPerhaps the greatest value of history is not that it tells us exactly what to do.\nIt reminds us that the present is temporary.\nAnd that is both comforting and slightly alarming.\n重要表現\ninstruction manual / institution / crisis / consequence / anticipate / assumption / inevitable / temporary\n音読POINT\nHistory also challenges the assumption / that the way we live now / is natural or inevitable.\nPerhaps the greatest value of history is not / that it tells us exactly what to do. / It reminds us / that the present is temporary.\nWIT POINT\n歴史は未来の「答え集」ではありません。しかし、今の常識も永遠ではないと教えてくれます。最後の comforting and slightly alarming は準1級らしい少しひねった締め方です。\n第7分野｜経済・仕事", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 151, "title": "The Magic Word “Sale”", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "A customer enters a store with no intention of buying anything. Then she sees a large red sign: “SALE — 40% OFF.”\nSuddenly, an object she did not need five minutes ago begins to look extremely attractive.\nDiscounts can influence consumers because people compare the sale price with the original price. Saving 40 percent feels like gaining money, even though buying the product still requires spending the other 60 percent.\nA bargain is valuable when we actually need the product.\nBuying something unnecessary for half price does not save half the money. It spends half the money.\n重要表現\nhave no intention of / discount / influence / consumer / original price / bargain / unnecessary\nWIT POINT\n「1万円の商品を5,000円で買って5,000円得した」ではなく、不要なら「5,000円使った」が正解です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 152, "title": "Why Expensive Coffee Still Sells", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "Coffee can be made relatively cheaply at home, yet many people regularly buy much more expensive coffee at cafés.\nThey are not necessarily paying only for the drink. A café may provide a comfortable place to meet friends, work, rest, or simply spend time away from home.\nBusinesses often sell an experience together with a physical product.\nThis explains why comparing prices alone does not always explain consumer behavior.\nA cup of coffee may contain coffee, milk, and sugar—but its price may also contain a chair, music, Wi-Fi, and forty minutes of not washing the cup yourself.\n重要表現\nrelatively / necessarily / provide / physical product / consumer behavior / contain", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 153, "title": "The Busy Person Gets More Work", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "In many workplaces, reliable employees experience a strange reward for being efficient: they are given more work.\nManagers naturally prefer to give important tasks to people who complete them successfully. As a result, capable workers may gradually become busier than everyone else.\nThis can create a problem if good performance is rewarded only with additional responsibilities.\nOrganizations need to recognize achievement while also distributing work fairly.\nOtherwise, an efficient worker may eventually discover the secret to having less work: becoming slightly less efficient.\nThat is probably not the lesson the organization intended to teach.\n重要表現\nreliable / efficient / complete a task / capable / responsibility / distribute / achievement", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 154, "title": "The Meeting about the Meeting", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "Meetings are useful when people need to exchange information, discuss problems, or make decisions.\nHowever, organizations sometimes hold meetings simply because meetings have always been held.\nA one-hour meeting involving ten employees consumes ten hours of working time, not one. This does not mean meetings are wasteful, but their cost is easy to underestimate.\nBefore arranging a meeting, it may be useful to ask whether the same purpose could be achieved with a short message.\nAnd if a meeting is required to decide whether another meeting is necessary, there may already be a problem.\n重要表現\nexchange information / consume / wasteful / underestimate / arrange / achieve a purpose\nWIT POINT\n「次の会議をいつ開くか決める会議」が始まったら要注意です。", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 155, "title": "Why We Pay for Convenience", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "People often pay more for products and services that save time or effort.\nPrepared food costs more than its ingredients. A taxi usually costs more than public transportation. Delivery services charge people to bring products directly to their homes.\nFrom a purely financial perspective, these choices may appear inefficient. However, time and effort also have value.\nConsumers are therefore not always choosing between an expensive product and a cheap one. They may be choosing between spending money and spending time.\nThe cheapest option is not necessarily the least costly option once our own time is included.\n重要表現\nconvenience / ingredient / purely / financial / inefficient / option / costly", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 156, "title": "The First Paycheck", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "Receiving a first paycheck can be an exciting experience. The number on the paper or bank account represents hours of work and a new degree of independence.\nThen come taxes, transportation costs, food, rent, and other expenses.\nThe impressive number at the top gradually becomes a smaller number available for personal use.\nThis experience teaches an important economic lesson: income and disposable income are not the same thing.\nIt may also explain why adults sometimes look less excited about payday than children expect them to.\n重要表現\npaycheck / represent / independence / expense / disposable income / payday", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 157, "title": "Why People Leave Tips", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "Tipping customs differ greatly between countries. In some places, a tip is expected for many services; in others, it may be unnecessary or even unusual.\nThis can confuse travelers because the price printed on a menu may not represent the final amount they are expected to pay.\nTipping also raises questions about wages, customer expectations, and how service work should be rewarded.\nThe safest rule for travelers is to learn local customs rather than assume that their own system applies everywhere.\nNothing makes an international meal more complicated than finishing dessert and suddenly needing an economics lesson.\n重要表現\ncustom / tip / be expected / final amount / wage / reward / apply", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 158, "title": "The Cost of Owning Things", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "The price paid for a product is not always its total cost.\nA car requires fuel, insurance, maintenance, parking, and repairs. A house requires maintenance and taxes. Even a printer that seems inexpensive may require surprisingly costly ink.\nConsumers therefore benefit from considering the cost of ownership rather than only the purchase price.\nA cheap product can become expensive over time if it requires frequent repairs or expensive supplies.\nSometimes the least expensive part of owning something is buying it.\n重要表現\ntotal cost / insurance / maintenance / ownership / purchase price / supply", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 159, "title": "Why Shops Put Small Things near the Cash Register", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "Supermarkets and other stores carefully consider where products are placed.\nSmall inexpensive items are often displayed near the cash register because customers waiting to pay have time to notice them. Since the price is low, adding one more item may not feel like an important decision.\nSuch purchases are often called impulse purchases because they are made without much planning.\nA customer may successfully resist expensive products throughout the entire store, only to be defeated at the final meter by a small bar of chocolate.\nRetail strategy understands that human self-control sometimes becomes tired before we reach the door.\n重要表現\ndisplay / cash register / notice / impulse purchase / resist / retail / self-control", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 160, "title": "Saving a Little", "subtitle": "", "theme": "経済・仕事", "level": "英検2級", "body": "People sometimes avoid saving money because the amount they can save seems too small to matter.\nHowever, small amounts accumulated regularly can become significant over a long period. The same principle applies in the opposite direction: small unnecessary expenses repeated every day can become surprisingly large.\nThis is why financial habits often matter more than individual decisions.\nNobody becomes wealthy because they refused one cup of coffee, and nobody becomes poor because they bought one.\nThe important question is what happens repeatedly.\n重要表現\naccumulate / significant / over a long period / unnecessary / financial habit / repeatedly", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 161, "title": "The Price of Time", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "Imagine that one route to work takes an hour but costs very little, while another takes only thirty minutes but costs more.\nWhich route is cheaper?\nThe answer depends partly on how a person values thirty minutes of time. For someone with limited money, the slower route may be reasonable. For someone facing an urgent deadline, paying more may be worthwhile.\nEconomic decisions often involve resources that do not have visible price tags.\nTime is one of them.\nEveryone receives twenty-four hours a day, which sounds wonderfully equal until we remember that people have very different demands on those hours.\n重要表現\ndepend partly on / limited / deadline / worthwhile / resource / demand", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 162, "title": "Why Prices Change", "subtitle": "", "theme": "経済・仕事", "level": "英検2級→準1級", "body": "Consumers sometimes become frustrated when the price of a familiar
