コミュニケーション", "level": "英検準1級", "body": "There is rarely only one possible translation of a complex sentence.\nA translator must decide what to prioritize: literal meaning, natural expression, tone, rhythm, cultural references, or the effect on the reader.\nDifferent purposes may require different solutions. A legal document demands precision, while a novel may require greater attention to style and voice.\nTranslation is therefore an act of interpretation as well as linguistic transfer.\nThe translator must remain faithful to the original while producing something that actually works in another language.\nIt is a job in which two perfectly reasonable sentences can disagree about how to say the same thing.\n重要表現\nprioritize / literal / tone / precision / interpretation / linguistic transfer / faithful", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 245, "title": "English as a Global Language", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "English is used internationally in science, business, aviation, technology, education, entertainment, and many other fields.\nIts global position developed through historical processes including British imperial expansion and the later economic and cultural influence of the United States.\nToday, much English communication occurs between people who are not native speakers.\nThis raises an important question about ownership.\nIf millions of people use English internationally, the language cannot be understood solely as the property of its native-speaking communities.\nA global language belongs, in practical terms, to the people who use it.\nAnd they use it with many accents.\n重要表現\ninternationally / imperial / expansion / influence / ownership / solely / in practical terms", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 246, "title": "Do We Need Perfect Pronunciation?", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Language learners often admire native-like pronunciation, and improving pronunciation can certainly make communication easier.\nHowever, perfection is neither necessary nor always realistic.\nThe more useful goals are intelligibility, listening ability, appropriate rhythm, and confidence in communication.\nAn accent may reveal something about a speaker's linguistic history rather than represent a defect.\nOf course, pronunciation errors that change meaning deserve attention.\nBut language exists for communication, not for passing an audition to become someone else.\nA successful conversation is better evidence of speaking ability than a perfectly pronounced sentence that was never spoken.\n重要表現\nnative-like / realistic / intelligibility / rhythm / linguistic / defect / audition", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 247, "title": "The Courage to Speak", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Adults learning a foreign language often know more than they are willing to say.\nThey may remain silent because they are searching for the perfect word or fear making a grammatical mistake.\nChildren are often less concerned about such imperfections. They use the language available to them and gradually improve through interaction.\nAccuracy matters, especially in formal situations. But excessive fear of error can prevent learners from gaining the experience required to become more accurate.\nCommunication requires knowledge.\nIt also requires a willingness to be temporarily imperfect.\nNobody learns to swim by waiting beside the pool until their swimming technique is flawless.\n重要表現\nremain silent / grammatical / imperfection / interaction / accuracy / excessive / flawless", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 248, "title": "Learning a Language through Its History", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "Vocabulary can seem like a collection of arbitrary sounds that simply have to be memorized.\nHistorical linguistics offers another way to look at it.\nWords often belong to families, change their sounds systematically, and carry evidence of contact between cultures. Comparing related words across languages can reveal patterns that make vocabulary more meaningful.\nLanguage learning then becomes partly historical investigation.\nInstead of asking only, “What does this word mean?” a learner can also ask, “Where did it come from, and what happened to it on the way here?”\nA dictionary tells us where a word lives today.\nEtymology sometimes tells us about its journey.\n重要表現\narbitrary / historical linguistics / systematically / related / investigation / etymology", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 249, "title": "When Strange Sounds Become Meaningful", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級", "body": "At the beginning of language learning, unfamiliar speech may sound like a continuous stream of noise.\nGradually, repeated exposure changes the experience. Individual words begin to emerge. Familiar expressions become recognizable. Eventually, sounds that once seemed meaningless begin to carry ideas, emotions, humor, and personality.\nThis transformation is one of the remarkable experiences of language learning.\nThe sound itself may not have changed at all.\nThe change has occurred inside the listener.\nOne day, a foreign broadcast is simply noise.\nLater, someone makes a joke on the same broadcast—and you laugh before translating it.\nAt that moment, the language is no longer entirely foreign.\n重要表現\nunfamiliar / continuous / exposure / emerge / recognizable / transformation / broadcast\n音読POINT\nThe sound itself / may not have changed at all. / The change has occurred / inside the listener.\nLater, someone makes a joke / on the same broadcast— / and you laugh / before translating it.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "", "extra": [], "special": false}, {"num": 250, "title": "Why Learn Another Language?", "subtitle": "", "theme": "文化・言語・コミュニケーション", "level": "英検準1級 → 1級への橋渡し", "body": "People learn foreign languages for many practical reasons. They may need them for work, travel, examinations, research, or communication.\nThese are valuable goals, but a language offers something more.\nLearning another language gives us access to ideas in the forms in which other people originally expressed them. It allows us to hear differences in humor, politeness, emotion, rhythm, and ways of describing experience that translation cannot always reproduce completely.\nIt also changes our relationship with our own language.\nWhen we discover that another language organizes an idea differently, things that once seemed natural suddenly become visible as choices made by history and culture.\nForeign-language learning therefore involves more than adding another communication tool.\nIt provides another perspective from which to observe human beings.\nAt first, an unknown language may sound like meaningless noise.\nThen one word becomes understandable.\nThen a sentence.\nThen a story.\nOne day, we realize that the strange sounds contain another person's thoughts—and that we can understand them.\nThe world has not become smaller.\nOur world has become larger.\nPerhaps that is the deepest reason to learn another language.\n重要表現\npractical / give access to / reproduce / relationship / perspective / meaningless / contain / deepest\n音読POINT\nAt first, / an unknown language may sound / like meaningless noise.\nThen one word becomes understandable. / Then a sentence. / Then a story.\nOne day, we realize / that the strange sounds contain / another person's thoughts— / and that we can understand them.\nThe world has not become smaller. / Our world has become larger.", "chunks": "", "translation": "", "important": "", "audio": "", "wit": "250題の最後なので、英検の問題文として終わらせず、**「外国語を学ぶとは何か」**で締めました。\nNo.249からNo.250は連作になっています。\nnoise → word → sentence → story → another person's thoughts\nという順に、「音」が「意味」に変わっていきます。\nそして最後は、\nThe world has not become smaller.\nOur world has become larger.\nです。", "extra": [], "special": false}]; const THEME_ORDER=['語学・教育','日常生活・文化','社会・交通','科学・技術','環境・自然','歴史・文明','経済・仕事','医療・健康','教育・学習','文化・言語・コミュニケーション'];
const LEVEL_ORDER=['旧教材・特別教材','英検2級','英検 2 級','英検2級→準1級','英検 2 級→準 1 級','英検準1級','英検準 1 級','英検準1級 → 1級への橋渡し'];
const normalizeLevel=v=>{
  const x=(v||'').replace(/\s/g,'');
  if(x.includes('旧教材')) return '旧教材・特別教材';
  if(x.includes('橋渡し')||x.includes('1級への')) return '準1級→1級';
  if(x.includes('2級→準1級')) return '2級→準1級';
  if(x.includes('準1級')) return '準1級';
  if(x.includes('2級')) return '2級';
  return v||'未設定';
};
const LEVELS=['2級','2級→準1級','準1級','準1級→1級','旧教材・特別教材'];
let mode='combo', theme='', selectedLevel='', favOnly=false;
const state=JSON.parse(localStorage.getItem('eikenReadingState')||'{}');
const save=()=>localStorage.setItem('eikenReadingState',JSON.stringify(state));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function progress(){let done=DATA.filter(x=>state[x.num]?.done).length;document.getElementById('progress').textContent=`学習済み ${done} / ${DATA.length}`}
function initSelects(){
  comboTheme.innerHTML='<option value="">全分野</option>'+THEME_ORDER.map((t,i)=>`<option value="${esc(t)}">第${i+1}分野 ${esc(t)}</option>`).join('');
  comboLevel.innerHTML='<option value="">全レベル</option>'+LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('');
  levelOnly.innerHTML='<option value="">全レベル</option>'+LEVELS.map(l=>`<option value="${l}">${l}</option>`).join('');
}
function renderThemes(){
  let e=document.getElementById('themes'); if(!e) return;
  e.innerHTML=THEME_ORDER.map((t,i)=>{let c=DATA.filter(x=>x.theme===t).length;return `<button class="theme ${theme===t?'active':''}" onclick="setTheme('${t.replace(/'/g,"\\'")}')"><b>第${i+1}分野　${esc(t)}</b><small>${c}題</small></button>`}).join('');
}
window.setTheme=t=>{theme=theme===t?'':t;closeDetail();render()};
window.setMode=m=>{
  mode=m; theme=''; selectedLevel=''; closeDetail();
  document.querySelectorAll('.modebtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  ['combo','theme','level','search'].forEach(x=>document.getElementById(x+'Panel').classList.toggle('hidden',x!==m));
  render();
};
function searchable(x){
  return [x.title,x.subtitle,x.theme,x.level,x.body,x.chunks,x.translation,x.important,x.audio,x.wit,...(x.extra||[]).flatMap(z=>[z.title,z.text])].join(' ').toLowerCase();
}
function filtered(){
  let a=DATA.slice();
  if(mode==='combo'){
    const t=comboTheme.value, l=comboLevel.value;
    if(t) a=a.filter(x=>x.theme===t);
    if(l) a=a.filter(x=>normalizeLevel(x.level)===l);
  }else if(mode==='theme'){
    if(theme) a=a.filter(x=>x.theme===theme);
  }else if(mode==='level'){
    const l=levelOnly.value;
    if(l) a=a.filter(x=>normalizeLevel(x.level)===l);
  }else if(mode==='search'){
    const q=document.getElementById('q').value.trim().toLowerCase();
    if(q) a=a.filter(x=>searchable(x).includes(q));
  }
  if(favOnly) a=a.filter(x=>state[x.num]?.fav);
  return a;
}
function render(){
  renderThemes(); progress();
  let a=filtered(),e=document.getElementById('list');
  document.getElementById('resultCount').textContent=`表示 ${a.length} / ${DATA.length}題`;
  e.innerHTML=a.length?a.map(x=>`<div class="item ${state[x.num]?.done?'done':''}"><div class="no">No.${String(x.num).padStart(3,'0')}</div><div onclick="openItem(${x.num})" style="cursor:pointer"><div class="ttl">${esc(x.title)}</div><div class="meta">${esc(x.theme)} ｜ ${esc(normalizeLevel(x.level))}</div><div class="study">${state[x.num]?.done?'✓ 学習済み':''}</div></div><button class="fav" onclick="toggleFav(${x.num},event)">${state[x.num]?.fav?'★':'☆'}</button></div>`).join(''):'<div class="empty">該当する教材がありません。</div>';
}
window.toggleFav=(n,e)=>{e.stopPropagation();state[n]=state[n]||{};state[n].fav=!state[n].fav;save();render()};
window.openItem=n=>{stopSpeech();
  let x=DATA.find(z=>z.num===n),d=document.getElementById('detail');
  let extras=(x.extra||[]).map(z=>`<details><summary>${esc(z.title)}</summary><div class="pre">${esc(z.text)}</div></details>`).join('');
  d.innerHTML=`<h2>No.${String(n).padStart(3,'0')}｜${esc(x.title)}</h2>${x.subtitle?`<div>${esc(x.subtitle)}</div>`:''}<span class="badge">${esc(x.theme)}</span><span class="badge">${esc(normalizeLevel(x.level))}</span>${x.special?'<span class="badge">特別教材</span>':''}<div class="speechbar"><button onclick="speakItem(${n})">▶ 読み上げ</button><button onclick="pauseSpeech()">⏸ 一時停止</button><button onclick="resumeSpeech()">⏵ 再開</button><button onclick="stopSpeech()">■ 停止</button><label>速度 <select id="speechRate" onchange="setSpeechRate(this.value)"><option value="0.7">0.7倍</option><option value="0.85">0.85倍</option><option value="1" selected>1.0倍</option><option value="1.15">1.15倍</option><option value="1.3">1.3倍</option></select></label><label>音声 <select id="speechVoice" onchange="setSpeechVoice(this.value)"></select></label><button onclick="toggleEnglish()">英文を隠す／表示</button><span class="speechnote" id="speechStatus">端末に搭載された英語音声で読み上げます。音声は端末によって異なります。</span></div><div id="englishBody" class="body">${esc(englishOnly(x.body))}</div>${x.chunks?`<details><summary>チャンク音読</summary><div class="pre">${esc(x.chunks)}</div></details>`:''}${x.translation?`<details><summary>日本語訳</summary><div class="pre">${esc(x.translation)}</div></details>`:''}${x.important?`<details><summary>重要表現</summary><div class="pre important">${esc(x.important)}</div></details>`:''}${x.audio?`<details><summary>音読 POINT</summary><div class="pre">${esc(x.audio)}</div></details>`:''}${x.wit?`<details><summary>WIT POINT・解説</summary><div class="pre">${esc(x.wit)}</div></details>`:''}${extras}<div class="nav"><button onclick="prev(${n})">← 前へ</button><button onclick="toggleDone(${n})">${state[n]?.done?'✓ 学習済み':'学習済みにする'}</button><button onclick="next(${n})">次へ →</button><button onclick="closeDetail()">閉じる</button></div>`;
  populateVoices();d.classList.add('open');d.scrollIntoView({behavior:'smooth',block:'start'});
};
window.closeDetail=()=>{stopSpeech();document.getElementById('detail').classList.remove('open')};
window.toggleDone=n=>{state[n]=state[n]||{};state[n].done=!state[n].done;save();render();openItem(n)};
window.prev=n=>openItem(Math.max(1,n-1)); window.next=n=>openItem(Math.min(250,n+1));
comboTheme.addEventListener('change',render); comboLevel.addEventListener('change',render); levelOnly.addEventListener('change',render);
document.getElementById('q').addEventListener('input',render);
document.getElementById('clearSearch').onclick=()=>{document.getElementById('q').value='';render()};
document.getElementById('showFav').onclick=()=>{favOnly=!favOnly;document.getElementById('showFav').textContent=favOnly?'★ お気に入りのみ':'★ お気に入り';render()};

// Read only the English passage, excluding embedded Japanese notes and exercise labels.
function englishOnly(body){return String(body||'').split(/\n(?:重要表現|音読POINT|WIT POINT|解説|日本語訳|内容確認|音読トレーニング)(?:\n|$)/)[0].trim();}
let voiceRate=1,voiceIndex='',utterance=null;
function englishVoices(){return speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}
function populateVoices(){const el=document.getElementById('speechVoice');if(!el)return;const vv=englishVoices();el.innerHTML=vv.length?vv.map((v,i)=>`<option value="${i}">${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option value="">英語音声を読み込み中</option>';let index=vv.findIndex(v=>v.lang==='en-US');if(index<0)index=0;el.value=voiceIndex!==''&&vv[Number(voiceIndex)]?voiceIndex:String(index);}
if('speechSynthesis' in window){speechSynthesis.addEventListener?.('voiceschanged',populateVoices);}
window.setSpeechRate=v=>{voiceRate=Number(v)};
window.setSpeechVoice=v=>{voiceIndex=v};
window.stopSpeech=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();utterance=null};
window.pauseSpeech=()=>{if('speechSynthesis' in window)speechSynthesis.pause()};
window.resumeSpeech=()=>{if('speechSynthesis' in window)speechSynthesis.resume()};
window.toggleEnglish=()=>document.getElementById('englishBody')?.classList.toggle('concealed');
window.speakItem=n=>{
 const status=document.getElementById('speechStatus');
 if(!('speechSynthesis' in window)){if(status)status.textContent='このブラウザは読み上げに対応していません。';return;}
 stopSpeech();const x=DATA.find(y=>y.num===n);if(!x)return;
 const u=new SpeechSynthesisUtterance(englishOnly(x.body));u.lang='en-US';u.rate=voiceRate;
 const voices=englishVoices();const sel=document.getElementById('speechVoice');if(sel&&voices[Number(sel.value)])u.voice=voices[Number(sel.value)];
 u.onstart=()=>{if(status)status.textContent='読み上げ中…'};
 u.onend=()=>{if(status)status.textContent='読み上げ終了'};
 u.onerror=()=>{if(status)status.textContent='読み上げできませんでした。端末の音声設定をご確認ください。'};
 utterance=u;speechSynthesis.speak(u);
};

initSelects(); render();
</script></body></html>
